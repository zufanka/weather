<style>
  :root{
    /* The page is a dark design by intent — declare it so the browser
       renders UA chrome (scrollbars, form controls) dark in BOTH system
       color modes, and so Chrome-on-Android's algorithmic "auto dark"
       leaves this hand-tuned palette alone instead of re-darkening it. */
    color-scheme:dark;
    --bg: #0e141b;
    --bg-panel: #131b24;
    --bg-card: #161f29;
    --grid-line: #223140;
    --ink: #e9e4d6;
    --ink-dim: #8fa0ab;
    --ink-faint: #56656f;
    --accent: #d7cdb0;
    --c-precip: #6ea3d1;
    --c-confidence: #d68fae;
    --c-sun: #ffd54a;
    --c-icon: #d65d4a;
    --c-ecmwf: #4f8fdb;
    --c-gfs: #4fb37a;
    --c-gem: #e0c23d;
    --c-ukmo: #a884d6;
    --c-meteofrance: #29b6d8;
    --risk-storm: #e35b5b;
    --risk-rain: #4f8fdb;
    --risk-snow: #7fd9e6;
    --risk-none: #223140;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top left, #16202b 0%, var(--bg) 55%);
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px;}

  /* header */
  header{margin-bottom:22px;}
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(26px,5vw,38px);
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  h1 span{color:var(--c-ecmwf);}
  .sub{color:var(--ink-dim);font-size:13px;margin-bottom:18px;}

  /* search */
  .search-box{position:relative;max-width:420px;}
  .search-box input{
    width:100%;
    background:var(--bg-panel);
    border:1px solid var(--grid-line);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    padding:11px 14px;
    border-radius:3px;
    outline:none;
  }
  .search-box input:focus{border-color:var(--c-ecmwf);}
  .search-box input::placeholder{color:var(--ink-faint);}
  .results{
    position:absolute;top:calc(100% + 4px);left:0;right:0;
    background:var(--bg-panel);
    border:1px solid var(--grid-line);
    border-radius:3px;
    overflow:hidden;
    z-index:20;
    display:none;
  }
  .results.show{display:block;}
  .result-item{
    padding:13px 14px;
    cursor:pointer;
    font-size:13px;
    border-bottom:1px solid var(--grid-line);
    display:flex;justify-content:space-between;gap:10px;
  }
  .result-item:last-child{border-bottom:none;}
  .result-item:hover{background:#1c2733;}
  .result-item .rname{color:var(--ink);}
  .result-item .rmeta{color:var(--ink-dim);font-size:11px;white-space:nowrap;}

  .remember-toggle{
    display:flex;align-items:center;gap:7px;
    font-size:12px;color:var(--ink-dim);
    margin-top:10px;cursor:pointer;user-select:none;
  }
  .remember-toggle input{accent-color:var(--c-ecmwf);width:14px;height:14px;cursor:pointer;}
  .status{color:var(--ink-dim);font-size:12px;margin-top:10px;min-height:16px;}
  .status-error{color:#e8a48c;}

  /* hero spread */
  .hero{
    margin-top:26px;
    /* A whisper of the IFS blue bleeding in from the top-left corner, so
       the panel reads as a surface, not a flat slab — without competing
       with the charts inside it. */
    background:linear-gradient(135deg, rgba(79,143,219,.07), transparent 42%), var(--bg-panel);
    border:1px solid var(--grid-line);
    border-radius:6px;
    padding:22px 24px 24px;
  }
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:18px;}
  .hero-place{
    font-family:'Space Grotesk',sans-serif;font-weight:700;
    font-size:clamp(20px,3vw,26px);letter-spacing:-0.01em;line-height:1.15;color:var(--ink);
  }
  .hero-place-country{color:var(--ink-dim);font-weight:500;font-size:.7em;}
  .day-switch{
    display:inline-flex;background:#1a232d;border:1px solid var(--grid-line);
    border-radius:20px;padding:3px;gap:2px;margin-top:12px;
  }
  .day-switch-btn{
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;
    color:var(--ink-dim);background:transparent;border:none;
    border-radius:16px;padding:9px 16px;cursor:pointer;
  }
  .day-switch-btn:hover:not(.active){color:var(--ink);}
  .day-switch-btn.active{background:var(--c-ecmwf);color:#0a121a;}
  .hero-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;}
  .hero-now-main{display:flex;align-items:center;gap:12px;}
  .hero-now-icon{font-size:30px;line-height:1;}
  .hero-now-val{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(40px,6vw,54px);line-height:1;color:var(--ink);letter-spacing:-0.02em;}
  .hero-now-hl{display:flex;flex-direction:column;gap:3px;text-align:left;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;}
  .hero-now-hl .hl-tag{color:var(--ink-faint);font-weight:500;font-size:10px;}
  .hero-now-range{font-size:11px;color:var(--ink-dim);margin-top:5px;}
  /* One wrapping row of context under the big temperature: today's
     sun/moon first, then the whole-view forecast numbers (wind, sun,
     air), then a faint tag scoping them to the active 24h/72h window. */
  .hero-meta{
    display:flex;flex-wrap:wrap;justify-content:flex-end;
    gap:3px 16px;margin-top:10px;
    font-size:12px;color:var(--ink-dim);
  }
  .hero-meta-item{white-space:nowrap;}
  .hero-meta-range{color:var(--ink-faint);}
  .chart-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:16px;
    color:var(--ink);
    margin:20px 0 10px;
    display:flex;align-items:center;gap:7px;
  }

  /* (i) info icon that opens a small explanatory tooltip on click/tap —
     click rather than hover so it works the same on mobile and desktop. */
  .info-icon{
    position:relative;
    display:inline-flex;align-items:center;justify-content:center;
    width:16px;height:16px;flex:none;
    border-radius:50%;border:1px solid var(--ink-faint);background:transparent;
    color:var(--ink-dim);font-family:'Space Grotesk',sans-serif;
    font-size:10px;font-weight:600;line-height:1;cursor:pointer;padding:0;
  }
  .info-icon:hover,.info-icon:focus-visible{border-color:var(--c-ecmwf);color:var(--ink);outline:none;}
  .info-icon .info-tooltip{
    display:none;position:absolute;z-index:30;
    top:calc(100% + 8px);
    /* Every (i) icon sits at the left edge of a section title, so the
       tooltip is left-anchored to it everywhere — desktop and mobile —
       rather than centered. Centering would push it past the left screen
       edge on narrow viewports; anchoring left with a viewport-clamped
       width can never bleed on either. */
    left:-4px;
    width:min(260px,calc(100vw - 48px));
    background:var(--bg-card);border:1px solid var(--grid-line);border-radius:6px;
    padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.4);
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:400;
    line-height:1.5;color:var(--ink-dim);text-align:left;white-space:normal;cursor:auto;
  }
  .info-icon.open .info-tooltip{display:block;}
  .temp-chart-wrap{
    margin:0 0 20px;background:var(--bg-card);border:1px solid var(--grid-line);
    border-radius:6px;padding:14px 12px 4px;
  }
  /* Desktop affordance for tap-to-filter: the temp line nearest the
     cursor (within the same 12px tolerance a tap uses) thickens via a
     class toggle from mousemove — no state, no re-render. */
  .temp-chart-wrap path.temp-line-hover{stroke-width:4.5;}
  .aq-legend{margin-top:8px;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--grid-line);padding-top:8px;}
  .aq-legend-row{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;}
  .aq-legend-item{display:inline-flex;align-items:center;gap:4px;font-size:9px;color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;}
  .aq-legend-sw{display:inline-block;width:14px;height:9px;border-radius:2px;}
  .aq-legend-lead{font-size:9px;color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;opacity:.7;margin-right:2px;}
  .spread-block{border-bottom:1px solid var(--grid-line);padding-bottom:8px;margin-bottom:12px;}
  .sub-head{
    font-family:'Space Grotesk',sans-serif;font-weight:700;
    font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink);margin:0 0 8px;
  }

  .hazard-row{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:18px;}
  .hazard-chip{
    display:flex;align-items:center;gap:7px;
    background:#1a232d;border:1px solid var(--grid-line);
    border-radius:20px;padding:6px 12px 6px 10px;
    font-size:12px;
  }
  .hazard-dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .hazard-high .hazard-dot{background:#e35d4f;box-shadow:0 0 6px #e35d4faa;}
  .hazard-high{border-color:#5c2e2a;background:#291b1a;}
  .hazard-high .hazard-label{color:#f0b3ab;}
  .hazard-low .hazard-dot{background:#e0a13d;}
  .hazard-low .hazard-label{color:#e8d2ab;}
  .hazard-dim{opacity:.45;}
  .hazard-dim .hazard-dot{background:var(--ink-faint);}
  .hazard-dim .hazard-label{color:var(--ink-dim);}
  .hazard-count{color:var(--ink-dim);font-size:10px;}

  .strip{position:relative;height:78px;margin:0 6px 6px;}
  .strip-line{position:absolute;left:0;right:0;top:52px;height:2px;background:var(--ink-faint);border-radius:1px;}
  .strip-tick{position:absolute;top:48px;width:1px;height:10px;background:var(--ink-faint);transform:translateX(-50%);}
  .strip-dot{position:absolute;top:45px;width:15px;height:15px;border-radius:50%;border:2px solid var(--bg-panel);transform:translateX(-50%);}
  /* Strip dots are buttons driving the same model filter as the legend:
     strip the native button chrome (appearance/padding) so they paint
     exactly like the divs they replaced, and grow the touch target with an
     invisible ::after halo (~35px) — .strip-dot is already
     position:absolute, so the halo centers on the painted 15px dot. */
  .strip-dot{cursor:pointer;appearance:none;-webkit-appearance:none;padding:0;}
  .strip-dot::after{content:'';position:absolute;inset:-10px;border-radius:50%;}
  .strip-dot:focus-visible{outline:2px solid var(--c-ecmwf);outline-offset:2px;}
  .strip-val{position:absolute;top:0;font-size:11px;font-weight:600;transform:translateX(-50%);white-space:nowrap;}
  .strip-axis{position:absolute;top:62px;font-size:10px;color:var(--ink);transform:translateX(-50%);}

  .legend{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 22px;}
  .legend-item{
    display:flex;align-items:center;gap:6px;margin:0;
    font-family:inherit;font-size:11px;color:var(--ink-dim);
    background:transparent;border:1px solid transparent;border-radius:20px;
    padding:5px 11px 5px 9px;cursor:pointer;
    transition:opacity .15s,border-color .15s,background .15s,color .15s;
  }
  .legend-item:hover:not(:disabled){border-color:var(--grid-line);color:var(--ink);}
  .legend-item:focus-visible{outline:2px solid var(--c-ecmwf);outline-offset:2px;}
  /* Selected: filled pill in the model's own color (via the --mc custom
     property each item carries) plus a checkmark, so the state reads even
     to someone who can't distinguish the dot colors. Dimmed: present but
     not part of the filter — same color, faded. Unavailable is a separate,
     always-gray look (see .legend-item.is-unavailable below) so "no data
     here" is never mistaken for "not selected". */
  .legend-item.is-selected{background:#1a232d;border-color:var(--mc);color:var(--ink);}
  .legend-item.is-dimmed{opacity:.4;}
  .legend-item.is-unavailable{opacity:.35;cursor:default;}
  .legend-dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .legend-check{font-size:10px;color:var(--mc);}

  .no-data{font-size:11px;color:var(--ink-faint);padding:20px 0;text-align:center;}

  footer{margin-top:36px;font-size:11px;color:var(--ink-dim);line-height:1.6;}
  footer a{color:var(--ink-dim);}

  @media (max-width:640px){
    .wrap{padding:16px 12px 40px;}
    .hero{padding:16px 14px 18px;}
    .hero-top{flex-direction:column;align-items:flex-start;gap:12px;}
    .hero-right{text-align:left;width:100%;align-items:flex-start;}
    .hero-meta{justify-content:flex-start;}
  }
</style>
