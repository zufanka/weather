<body>
<div class="wrap">
  <header>
    <h1>rain<span>frog</span></h1>
    <div class="sub">Six national weather models, compared.</div>
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="Search a place… (e.g. Innsbruck)" autocomplete="off">
      <div class="results" id="results"></div>
    </div>
    <label class="remember-toggle">
      <input type="checkbox" id="rememberCheckbox">
      Remember this location
    </label>
    <div class="status" id="status"></div>
  </header>

  <div id="app"></div>

  <footer>
    Data: <a href="https://open-meteo.com" target="_blank">Open-Meteo.com</a>, CC BY 4.0 — ICON (DWD, Germany) · IFS (ECMWF) · GFS (NOAA) · GEM (ECCC, Canada) · UKMO (UK Met Office) · ARPEGE/AROME (Météo-France). Model availability and resolution vary by region; not all six always cover every location.
  </footer>
</div>

<script>
const MODELS = [
  { id:'icon_seamless',        name:'ICON',   agency:'DWD · Germany',        res:'~11 km · to 7d',  color:'var(--c-icon)' },
  { id:'ecmwf_ifs025',         name:'IFS',    agency:'ECMWF · Europe',       res:'9–25 km · to 15d', color:'var(--c-ecmwf)' },
  { id:'gfs_seamless',         name:'GFS',    agency:'NOAA · United States', res:'~11 km · to 16d', color:'var(--c-gfs)' },
  { id:'gem_seamless',         name:'GEM',    agency:'ECCC · Canada',        res:'~15 km · to 10d', color:'var(--c-gem)' },
  { id:'ukmo_seamless',        name:'UKMO',   agency:'Met Office · UK',      res:'~10 km · to 7d',  color:'var(--c-ukmo)' },
  { id:'meteofrance_seamless', name:'ARPEGE', agency:'Météo-France',         res:'~25 km · to 4d',  color:'var(--c-meteofrance)' },
];

// Shared horizontal geometry so the hourly x-axis lines up exactly between
// the temperature chart and the precipitation chart below it. Both charts
// size themselves to however many hours the active view covers (24 or 72),
// read straight off the data rather than a fixed constant.
const CHART_PAD_L = 14;
const CHART_PAD_R = 36;
const chartXFor = (padL, plotW, n) => i => padL + (i + 0.5) * (plotW / n);

// Pick the widest hour-label interval (from a set of clean divisors) that
// still keeps every label at least minSpacing px apart — so labels never
// crowd together on narrow screens, and both charts use the same interval
// so their gridlines/labels stay aligned. `candidates` lets a multi-day
// chart cap how coarse the step is allowed to get (see HOUR_TICK_CANDIDATES).
const CHART_LABEL_MIN_SPACING = 46;
function pickHourStep(plotW, hours, minSpacing, candidates) {
  const maxLabels = Math.max(2, Math.floor(plotW / (minSpacing || CHART_LABEL_MIN_SPACING)));
  const list = candidates || [1, 2, 3, 4, 6, 8, 12, 24, 48, 72];
  for (const step of list) {
    if (Math.ceil(hours / step) <= maxLabels) return step;
  }
  return list[list.length - 1];
}

// Divisors of 24 that top out at 8h — i.e. never fewer than 3 gridlines per
// calendar day, however little width is available. Used only once the chart
// spans more than a day, when a separate day axis (see buildXAxis) already
// carries the date, so the hour ticks stay short ("06") and can afford to
// sit close together on a phone screen.
const HOUR_TICK_CANDIDATES = [1, 2, 3, 4, 6, 8];
const DAY_AXIS_LABEL_SPACING = 24;

const WEEKDAY_ABBR = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

function hourAxisLabel(t, spanHours) {
  const timePart = t.split('T')[1];
  return spanHours > 24 ? timePart.slice(0, 2) : timePart.slice(0, 5);
}

// For tooltips, which have room for the full "HH:MM" rather than the axis's
// truncated "06", plus the weekday since a repeating 00:00 across several
// days would otherwise be ambiguous. Parsed as UTC-midnight-of-that-date so
// the weekday can't drift with the browser's own timezone.
function hourTooltipLabel(t, spanHours) {
  const [datePart, timePart] = t.split('T');
  const hm = timePart.slice(0, 5);
  if (spanHours <= 24) return hm;
  const weekday = WEEKDAY_ABBR[new Date(datePart + 'T00:00:00Z').getUTCDay()];
  return `${weekday} ${hm}`;
}

// The x-axis shared by the temperature and precipitation charts: hour
// gridlines/labels, plus — once the view spans more than a day — a coarser
// day axis underneath it (a stronger boundary line where the date rolls
// over, and a weekday label centered under each day's segment), so days
// don't have to be squeezed into the hour labels themselves. `topOffset`
// pushes every label row down by that many px, for a chart that needs to
// reserve a strip just below the plot for something else first (the
// precipitation chart's confidence dots).
function buildXAxis(times, n, plotW, plotH, PAD_L, PAD_T, topOffset) {
  const xFor = chartXFor(PAD_L, plotW, n);
  const isMultiDay = n > 24;
  const hourStep = isMultiDay
    ? pickHourStep(plotW, n, DAY_AXIS_LABEL_SPACING, HOUR_TICK_CANDIDATES)
    : pickHourStep(plotW, n);
  const off = topOffset || 0;

  const vLines = [];
  const hourLabels = [];
  const hourLabelY = PAD_T + plotH + off + (isMultiDay ? 14 : 20);
  for (let i = 0; i < n; i += hourStep) {
    const t = times[i];
    if (!t) continue;
    const x = xFor(i);
    vLines.push(`<line x1="${x.toFixed(1)}" y1="${PAD_T}" x2="${x.toFixed(1)}" y2="${(PAD_T + plotH).toFixed(1)}" stroke="var(--grid-line)" stroke-width="1" opacity="0.5"/>`);
    hourLabels.push(`<text x="${x.toFixed(1)}" y="${hourLabelY.toFixed(1)}" font-size="10" fill="var(--ink)" text-anchor="middle" font-family="IBM Plex Mono">${hourAxisLabel(t, n)}</text>`);
  }

  let dayLines = '', dayLabels = '';
  if (isMultiDay) {
    // Split the hours into per-calendar-day segments so each one gets its
    // own boundary line and a label centered under its own span.
    const segments = [];
    let segStart = 0, segDate = times[0] ? times[0].split('T')[0] : null;
    for (let i = 1; i < n; i++) {
      if (!times[i]) continue;
      const d = times[i].split('T')[0];
      if (d !== segDate) {
        segments.push({ start: segStart, end: i - 1, date: segDate });
        segStart = i;
        segDate = d;
      }
    }
    segments.push({ start: segStart, end: n - 1, date: segDate });

    const colW = plotW / n;
    const dayLineParts = [];
    const dayLabelParts = [];
    const dayLabelY = PAD_T + plotH + off + 30;
    segments.forEach((seg, si) => {
      if (si > 0) {
        const x = xFor(seg.start) - colW / 2; // sits between the two straddling hours
        dayLineParts.push(`<line x1="${x.toFixed(1)}" y1="${PAD_T}" x2="${x.toFixed(1)}" y2="${(PAD_T + plotH).toFixed(1)}" stroke="var(--grid-line)" stroke-width="1" opacity="0.9"/>`);
      }
      const x = xFor((seg.start + seg.end) / 2);
      const label = si === 0 ? 'Today' : WEEKDAY_ABBR[new Date(seg.date + 'T00:00:00Z').getUTCDay()];
      dayLabelParts.push(`<text x="${x.toFixed(1)}" y="${dayLabelY.toFixed(1)}" font-size="10" fill="var(--ink)" text-anchor="middle" font-family="IBM Plex Mono" letter-spacing="0.03em">${label}</text>`);
    });
    dayLines = dayLineParts.join('');
    dayLabels = dayLabelParts.join('');
  }

  return { vLines: vLines.join(''), hourLabels: hourLabels.join(''), dayLines, dayLabels };
}

const $ = sel => document.querySelector(sel);
const searchInput = $('#searchInput');
const resultsBox = $('#results');
const statusBox = $('#status');
const app = $('#app');
const rememberCheckbox = $('#rememberCheckbox');

let debounceTimer = null;
let currentPlace = null;
let lastAvailModels = null;

// Hours of forecast shown from right now: 24 = "24h", 72 = the rolling
// 3-day overview. Re-render on switch reuses the already-fetched response —
// no re-fetch needed.
let activeRange = 24;
let lastPlace = null;
let lastEntries = null;
let lastAstro = null;
// Air quality response (CAMS via Open-Meteo) — single source, so unlike
// the weather models there's nothing to filter; kept here for re-renders.
let lastAir = null;

// Model ids the user has clicked on in the legend, surviving re-renders the
// same way activeRange does (render() rebuilds the DOM from scratch, so the
// state has to live outside it). Empty = no filter, show everything at full
// strength — filtering is opt-in. Selection is single-select: the Set
// never holds more than one id — clicking a model replaces any previous
// selection, clicking the selected model clears it (back to "show all").
let selectedModels = new Set();

// Single-select toggle shared by every click path (legend, temp-chart
// hit-test, generic [data-model] taps) so they can't drift apart.
function toggleModelSelection(id) {
  if (selectedModels.has(id)) {
    selectedModels.delete(id);
  } else {
    selectedModels.clear();
    selectedModels.add(id);
  }
}

// The chosen ids aren't necessarily present at the currently-searched place
// (a model can be selected, then the user searches somewhere it doesn't
// cover). This resolves the raw selection against `avail` (models that
// actually returned data) into the Set every chart should treat as "the
// filter" — or null if that intersection is empty, meaning either nothing
// is selected or everything selected is unavailable here. Either way, null
// means render at full strength rather than a filter that matches nothing.
function effectiveSelection(avail) {
  if (!selectedModels.size) return null;
  const ids = avail.filter(m => selectedModels.has(m.id)).map(m => m.id);
  return ids.length ? new Set(ids) : null;
}

// Charts are drawn at the exact measured pixel width of their container
// (see renderResponsiveCharts), so 1 SVG unit = 1 CSS pixel and text is
// always true-size — never shrunk to illegibility, never needs to scroll.
// Redraw them on resize/orientation-change so they stay that way.
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderResponsiveCharts, 150);
});

const REMEMBER_KEY = 'rainfrog.modelSpread.place';
function saveRememberedPlace(place) {
  try { localStorage.setItem(REMEMBER_KEY, JSON.stringify(place)); } catch (e) {}
}
function clearRememberedPlace() {
  try { localStorage.removeItem(REMEMBER_KEY); } catch (e) {}
}
function loadRememberedPlace() {
  try {
    const raw = localStorage.getItem(REMEMBER_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

rememberCheckbox.addEventListener('change', () => {
  if (rememberCheckbox.checked) {
    if (currentPlace) saveRememberedPlace(currentPlace);
  } else {
    clearRememberedPlace();
  }
});

// --- tap-to-filter geometry (temperature chart) ------------------------
// The helpers between the [tap-geometry] markers are pure — no DOM — so
// they can be lifted out and exercised by a standalone test; nearestModelLine
// below is the thin DOM glue that feeds them real click coordinates.
// [tap-geometry begin]
const TEMP_TAP_TOLERANCE_PX = 12;

// Parse a polyline path's `d` attribute ("M123.4,56.7 L124.0,58.2 …") into
// [x,y] pairs. buildLineChart only ever emits M/L commands, so scooping up
// the coordinate pairs is exact, not a heuristic.
function parsePathPairs(d) {
  const pts = [];
  const re = /(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)/g;
  let m;
  while ((m = re.exec(d))) pts.push([parseFloat(m[1]), parseFloat(m[2])]);
  return pts;
}

// Distance from point (px,py) to segment (ax,ay)–(bx,by), with the
// projection clamped onto the segment so the endpoints count too.
function distToSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len2 = dx * dx + dy * dy;
  let t = len2 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}

function distToPolyline(px, py, pts) {
  if (!pts.length) return Infinity;
  if (pts.length === 1) return Math.hypot(px - pts[0][0], py - pts[0][1]);
  let best = Infinity;
  for (let i = 1; i < pts.length; i++) {
    const d = distToSegment(px, py, pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1]);
    if (d < best) best = d;
  }
  return best;
}

// candidates: [{model, pts}] → the one nearest the click, with its
// chart-space distance.
function pickNearestPolyline(x, y, candidates) {
  let best = null;
  for (const c of candidates) {
    const d = distToPolyline(x, y, c.pts);
    if (!best || d < best.dist) best = { model: c.model, dist: d };
  }
  return best;
}
// [tap-geometry end]

// Map a client-space click into the temperature chart's viewBox
// coordinates and pick the nearest model line. Distance comes back
// in chart units, so the caller converts to screen px before comparing
// against the tolerance — 12px should mean the same thing on a phone as
// on a desktop monitor.
function nearestModelLine(svg, clientX, clientY) {
  const rect = svg.getBoundingClientRect();
  if (!rect.width || !rect.height) return null;
  const vb = svg.viewBox.baseVal;
  if (!vb || !vb.width || !vb.height) return null;
  const scale = vb.width / rect.width;
  const x = (clientX - rect.left) * scale;
  const y = (clientY - rect.top) * (vb.height / rect.height);
  const candidates = [];
  const byModel = {};
  svg.querySelectorAll('path[data-role="model-line"]').forEach(p => {
    const pts = parsePathPairs(p.getAttribute('d') || '');
    if (pts.length) {
      candidates.push({ model: p.dataset.model, pts });
      byModel[p.dataset.model] = p;
    }
  });
  const best = pickNearestPolyline(x, y, candidates);
  if (!best || !best.model) return null;
  return { model: best.model, path: byModel[best.model], chartDist: best.dist, screenDist: best.dist / scale };
}

// Delegated on #app (not the buttons themselves) since render() rebuilds
// the whole hero — including these buttons — on every place load, tab
// switch, and model-filter click alike.
app.addEventListener('click', (e) => {
  if (!lastEntries) return;

  // (i) tooltips: toggle the clicked one, close any other that was open —
  // pure DOM class toggling, no re-render, so it doesn't disturb chart/
  // filter state or cause a flash.
  const infoBtn = e.target.closest('.info-icon');
  if (infoBtn) {
    const wasOpen = infoBtn.classList.contains('open');
    document.querySelectorAll('.info-icon.open').forEach(el => {
      el.classList.remove('open');
      el.setAttribute('aria-expanded', 'false');
    });
    if (!wasOpen) {
      infoBtn.classList.add('open');
      infoBtn.setAttribute('aria-expanded', 'true');
    }
    return;
  }

  const dayBtn = e.target.closest('.day-switch-btn');
  if (dayBtn) {
    const hours = Number(dayBtn.dataset.hours);
    if (hours === activeRange) return;
    activeRange = hours;
    render(lastPlace, lastEntries, lastAstro, lastAir);
    return;
  }

  const legendBtn = e.target.closest('.legend-item');
  if (legendBtn && !legendBtn.disabled) {
    const id = legendBtn.dataset.model;
    toggleModelSelection(id);
    render(lastPlace, lastEntries, lastAstro, lastAir);
    return; // must not fall through — the branches below would re-toggle it
  }

  // Temperature and wind charts: lines and area strokes cross and overlap
  // constantly, so
  // native hit-testing would hand every click to whichever line was
  // painted last, leaving the lines underneath untappable wherever they
  // cross — and fat hit-strokes (pointer-events:stroke + stroke-width)
  // have exactly the same paint-order problem, just fatter. Instead,
  // resolve the click to viewBox coordinates and pick the geometrically
  // nearest line within a small screen-space tolerance, so every line
  // stays equally tappable no matter where it crosses another.
  const lineSvg = e.target.closest('#tempChartHolder svg, #windChartHolder svg');
  if (lineSvg) {
    const hit = nearestModelLine(lineSvg, e.clientX, e.clientY);
    if (hit && hit.screenDist < TEMP_TAP_TOLERANCE_PX) {
      const id = hit.model;
      toggleModelSelection(id);
      render(lastPlace, lastEntries, lastAstro, lastAir);
    }
    return; // clicks inside the temp chart never fall through, even on empty plot
  }

  // Any other tappable chart element carrying a model id — precip bars and
  // total-strip dots — drives the same toggle the legend does; no new
  // semantics, no new state.
  const tapEl = e.target.closest('[data-model]');
  if (tapEl && tapEl.dataset.model && !tapEl.disabled) {
    const id = tapEl.dataset.model;
    toggleModelSelection(id);
    render(lastPlace, lastEntries, lastAstro, lastAir);
    return;
  }
});

// Clicking a legend or day-switch button — or a strip dot — re-renders the
// whole hero, which removes that button from the DOM. If the button just
// took focus on the mousedown (the browser default), that focus loss is
// what makes Safari scroll to the top. Stop mouse clicks from focusing
// these buttons in the first place, so the re-render can't trigger the
// jump; keyboard focus (Tab + Enter/Space) is unaffected and still works.
app.addEventListener('mousedown', (e) => {
  if (e.target.closest('.legend-item') || e.target.closest('.day-switch-btn') || e.target.closest('.strip-dot')) {
    e.preventDefault();
  }
});

// Desktop-only affordance for tap-to-filter: over the temperature chart,
// thicken the line nearest the cursor (same 12px tolerance a tap uses) so
// the interaction reads before the first click. Pure class toggle — no
// state, no re-render — and moving off the chart (or leaving #app)
// clears it so the highlight can't linger.
app.addEventListener('mousemove', (e) => {
  const holder = $('#tempChartHolder');
  if (!holder) return;
  const svg = e.target.closest ? e.target.closest('#tempChartHolder svg') : null;
  if (!svg) {
    holder.querySelectorAll('path.temp-line-hover').forEach(p => p.classList.remove('temp-line-hover'));
    return;
  }
  const hit = nearestModelLine(svg, e.clientX, e.clientY);
  const hot = hit && hit.screenDist < TEMP_TAP_TOLERANCE_PX ? hit.path : null;
  holder.querySelectorAll('path.temp-line-hover').forEach(p => { if (p !== hot) p.classList.remove('temp-line-hover'); });
  if (hot && !hot.classList.contains('temp-line-hover')) hot.classList.add('temp-line-hover');
});
app.addEventListener('mouseleave', () => {
  const p = document.querySelector('#tempChartHolder path.temp-line-hover');
  if (p) p.classList.remove('temp-line-hover');
});

searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  const q = searchInput.value.trim();
  if (q.length < 2) { resultsBox.classList.remove('show'); return; }
  debounceTimer = setTimeout(() => runGeocode(q), 300);
});

document.addEventListener('click', (e) => {
  if (!resultsBox.contains(e.target) && e.target !== searchInput) {
    resultsBox.classList.remove('show');
  }
  if (!e.target.closest('.info-icon')) {
    document.querySelectorAll('.info-icon.open').forEach(el => {
      el.classList.remove('open');
      el.setAttribute('aria-expanded', 'false');
    });
  }
});

async function runGeocode(q) {
  try {
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=en&format=json`;
    const res = await fetch(url);
    const data = await res.json();
    renderResults(data.results || []);
  } catch (e) {
    resultsBox.innerHTML = '<div class="result-item"><span class="rname">Search failed — try again</span></div>';
    resultsBox.classList.add('show');
  }
}

function renderResults(list) {
  if (!list.length) {
    resultsBox.innerHTML = '<div class="result-item"><span class="rname">No places found</span></div>';
    resultsBox.classList.add('show');
    return;
  }
  resultsBox.innerHTML = list.map((r, i) => {
    const region = [r.admin1, r.country].filter(Boolean).join(', ');
    return `<div class="result-item" data-i="${i}">
      <span class="rname">${escapeHtml(r.name)}</span>
      <span class="rmeta">${escapeHtml(region)}</span>
    </div>`;
  }).join('');
  resultsBox.classList.add('show');
  resultsBox.querySelectorAll('.result-item').forEach(el => {
    el.addEventListener('click', () => {
      const r = list[+el.dataset.i];
      if (!r.latitude) return;
      searchInput.value = `${r.name}, ${r.country || ''}`;
      resultsBox.classList.remove('show');
      loadPlace({ name: r.name, country: r.country, lat: r.latitude, lon: r.longitude });
    });
  });
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// A section headline with a click-to-open (i) tooltip explaining what the
// section shows. Click rather than hover so it's equally usable on a phone.
function sectionHead(title, info, extraHtml) {
  return `<div class="chart-title">${escapeHtml(title)}
    <button type="button" class="info-icon" aria-label="About ${escapeHtml(title)}" aria-haspopup="true" aria-expanded="false">i
      <span class="info-tooltip" role="tooltip">${escapeHtml(info)}${extraHtml || ''}</span>
    </button>
  </div>`;
}

async function fetchModel(place, model) {
  // forecast_days=4 guarantees a full 72h window is available no matter what
  // hour "now" falls on within day 0 (worst case: now = day 0, hour 23).
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}&hourly=temperature_2m,precipitation,precipitation_probability,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m,sunshine_duration&models=${model.id}&forecast_days=4&timezone=auto`;
  const res = await fetch(url);
  const body = await res.json().catch(() => null);
  if (!res.ok || !body || body.error) {
    const reason = (body && body.reason) ? body.reason : `HTTP ${res.status}`;
    throw new Error(reason);
  }
  return body;
}

async function fetchAstro(place) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}&daily=sunrise,sunset,moon_phase&forecast_days=2&timezone=auto`;
  const res = await fetch(url);
  const body = await res.json().catch(() => null);
  if (!res.ok || !body || body.error || !body.daily) return null;
  return body.daily;
}

async function fetchAirQuality(place) {
  const url = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${place.lat}&longitude=${place.lon}&hourly=european_aqi,uv_index,aerosol_optical_depth&forecast_days=4&timezone=auto`;
  const res = await fetch(url);
  const body = await res.json().catch(() => null);
  if (!res.ok || !body || body.error || !body.hourly) return null;
  return body;
}

async function loadPlace(place) {
  currentPlace = place;
  if (rememberCheckbox.checked) saveRememberedPlace(place);

  statusBox.textContent = `Fetching model runs for ${place.name}…`;
  app.innerHTML = '';

  const [settled, astro, air] = await Promise.all([
    Promise.allSettled(MODELS.map(m => fetchModel(place, m))),
    fetchAstro(place).catch(() => null),
    fetchAirQuality(place).catch(() => null),
  ]);

  const ok = settled.filter(s => s.status === 'fulfilled');
  if (!ok.length) {
    const firstError = settled.find(s => s.status === 'rejected');
    const reason = firstError ? firstError.reason.message : 'unknown error';
    statusBox.innerHTML = `<span class="status-error">Could not reach Open-Meteo (${escapeHtml(reason)}). This can happen if your network blocks outside API calls. Try again, or try another place.</span>`;
    return;
  }

  render(place, MODELS.map((m, i) => ({
    model: m,
    result: settled[i].status === 'fulfilled' ? settled[i].value : null,
    error: settled[i].status === 'rejected' ? settled[i].reason.message : null,
  })), astro, air);

  const failedCount = settled.length - ok.length;
  statusBox.textContent = failedCount ? `${failedCount} of ${MODELS.length} models unavailable for this location.` : '';
}

// Index of the current hour in the model's local time series — both the
// 24h and 72h views start right now, they just cover different spans from
// that point.
function findStartIndex(times, utcOffsetSeconds) {
  const nowLocal = new Date(Date.now() + utcOffsetSeconds * 1000);
  const y = nowLocal.getUTCFullYear();
  const mo = String(nowLocal.getUTCMonth() + 1).padStart(2, '0');
  const d = String(nowLocal.getUTCDate()).padStart(2, '0');
  const h = String(nowLocal.getUTCHours()).padStart(2, '0');
  const targetStr = `${y}-${mo}-${d}T${h}:00`;
  let idx = times.indexOf(targetStr);
  if (idx === -1) idx = times.findIndex(t => t >= targetStr);
  return idx === -1 ? 0 : idx;
}

function extractSeries(hourly, modelId, variable) {
  // find the key that matches variable_modelId, tolerant of naming variations
  const exact = `${variable}_${modelId}`;
  if (hourly[exact]) return hourly[exact];
  if (hourly[variable]) return hourly[variable]; // single-model response comes back unsuffixed
  const fuzzy = Object.keys(hourly).find(k => k.startsWith(variable) && k.endsWith(modelId));
  return fuzzy ? hourly[fuzzy] : null;
}

const THUNDER_CODES = [95, 96, 99];
const HEAVY_SNOW_CODES = [75, 86];
const HEAVY_RAIN_CODES = [65, 67, 82];
const FREEZING_RAIN_CODES = [66, 67];
const HEAVY_RAIN_MM_PER_HR = 4;
const STRONG_GUST_KMH = 60;
const SEVERE_GUST_KMH = 90;

function classifyHour(code, precip, gust) {
  return {
    thunder: THUNDER_CODES.includes(code),
    heavySnow: HEAVY_SNOW_CODES.includes(code),
    heavyRain: HEAVY_RAIN_CODES.includes(code) || (precip || 0) >= HEAVY_RAIN_MM_PER_HR,
    freezingRain: FREEZING_RAIN_CODES.includes(code),
    strongWind: (gust || 0) >= STRONG_GUST_KMH,
    severeWind: (gust || 0) >= SEVERE_GUST_KMH,
  };
}

function moonPhaseInfo(fraction) {
  if (fraction === null || fraction === undefined) return null;
  const f = ((fraction % 1) + 1) % 1;
  if (f < 0.03 || f >= 0.97) return { name: 'New Moon', emoji: '🌑' };
  if (f < 0.22) return { name: 'Waxing Crescent', emoji: '🌒' };
  if (f < 0.28) return { name: 'First Quarter', emoji: '🌓' };
  if (f < 0.47) return { name: 'Waxing Gibbous', emoji: '🌔' };
  if (f < 0.53) return { name: 'Full Moon', emoji: '🌕' };
  if (f < 0.72) return { name: 'Waning Gibbous', emoji: '🌖' };
  if (f < 0.78) return { name: 'Last Quarter', emoji: '🌗' };
  return { name: 'Waning Crescent', emoji: '🌘' };
}

// WMO weather-code → emoji for the hero's "now" glyph. Only the coarse
// condition matters here; the fine-grained codes still drive the hazard
// chips below.
function weatherEmoji(code) {
  if (code === 0) return '☀';
  if (code === 1) return '🌤';
  if (code === 2) return '⛅';
  if (code === 3) return '☁';
  if (code === 45 || code === 48) return '🌫';
  if (code >= 95) return '⛈';
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return '🌨';
  if (code === 66 || code === 67) return '🌨';
  if (code >= 61 && code <= 65) return '🌧';
  if (code >= 51 && code <= 57) return '🌦';
  if (code >= 80 && code <= 82) return '🌦';
  return '🌡';
}

// Always today's sunrise/sunset/moon — it's context for "right now", not a
// per-view forecast, so it doesn't change between the 24h and 72h views.
// Returned as discrete items so the hero's meta row can interleave them
// with the forecast stats on one wrapping line.
function astroParts(astro) {
  if (!astro || !astro.sunrise || !astro.sunrise[0]) return [];
  const parts = [`🌅 ${astro.sunrise[0].split('T')[1]}`];
  if (astro.sunset && astro.sunset[0]) parts.push(`🌇 ${astro.sunset[0].split('T')[1]}`);
  if (astro.moon_phase) {
    const moon = moonPhaseInfo(astro.moon_phase[0]);
    if (moon) parts.push(`${moon.emoji} ${moon.name}`);
  }
  return parts;
}

function render(place, entries, astro, air) {
  lastPlace = place;
  lastEntries = entries;
  lastAstro = astro;
  lastAir = air;

  // Rebuilding the hero removes the currently-focused legend/day-switch
  // button from the DOM. Some browsers (Safari/WebKit especially) react to
  // that focus loss by scrolling the page back to the top, which would pull
  // the user away from the chart they just clicked in. Remember the scroll
  // position now and restore it once the new DOM is in place.
  const scrollY = window.scrollY;

  const span = activeRange;

  const perModel = entries.map(({ model: m, result, error }) => {
    if (!result) return { ...m, available: false, error };
    const hourly = result.hourly;
    const times = hourly.time;
    const offset = result.utc_offset_seconds || 0;
    const nowIdx = findStartIndex(times, offset);

    const temps = extractSeries(hourly, m.id, 'temperature_2m');
    const precs = extractSeries(hourly, m.id, 'precipitation');
    const precipProbs = extractSeries(hourly, m.id, 'precipitation_probability');
    const codes = extractSeries(hourly, m.id, 'weather_code');
    const winds = extractSeries(hourly, m.id, 'wind_speed_10m');
    const gusts = extractSeries(hourly, m.id, 'wind_gusts_10m');
    if (!temps) return { ...m, available: false, error: 'no data returned' };

    const t = temps.slice(nowIdx, nowIdx + span);
    const p = (precs || t.map(() => 0)).slice(nowIdx, nowIdx + span).map(v => v || 0);
    const pp = (precipProbs || t.map(() => null)).slice(nowIdx, nowIdx + span);
    // Seconds of direct sunshine (WMO 120 W/m² threshold) in each hour;
    // null-safe fallback keeps the sun strip renderable even if a model
    // ever stops returning the variable.
    const suns = (extractSeries(hourly, m.id, 'sunshine_duration') || t.map(() => null)).slice(nowIdx, nowIdx + span);
    const c = (codes || t.map(() => 0)).slice(nowIdx, nowIdx + span);
    const w = (winds || t.map(() => 0)).slice(nowIdx, nowIdx + span).map(v => v || 0);
    const g = (gusts || t.map(() => 0)).slice(nowIdx, nowIdx + span).map(v => v || 0);
    // Wind direction in FROM-notation degrees (0 = from the north). Unlike
    // the other series it stays null where a model doesn't report — a 0°
    // would be a real direction (north), not a missing value — and nulls
    // drop out of the direction band's circular mean instead of bending it.
    const dirs = (extractSeries(hourly, m.id, 'wind_direction_10m') || t.map(() => null)).slice(nowIdx, nowIdx + span);
    const timesSpan = times.slice(nowIdx, nowIdx + span);
    const validT = t.filter(v => v !== null && v !== undefined);

    // Today's local calendar day, for the hero's high/low. The sliced span
    // below starts at "now", so it would miss earlier-today hours — use the
    // full series and keep whatever hours of today it covers (partial days
    // are fine, per design).
    const nowLocal = new Date(Date.now() + offset * 1000);
    const todayStr = `${nowLocal.getUTCFullYear()}-${String(nowLocal.getUTCMonth() + 1).padStart(2, '0')}-${String(nowLocal.getUTCDate()).padStart(2, '0')}`;
    const todayTemps = times
      .map((ts, i) => ts.startsWith(todayStr) ? temps[i] : null)
      .filter(v => v !== null && v !== undefined);
    const todayLow = todayTemps.length ? Math.min(...todayTemps) : null;
    const todayHigh = todayTemps.length ? Math.max(...todayTemps) : null;

    const hourFlags = p.map((v, i) => classifyHour(c[i], v, g[i]));
    const flags = {
      thunder: hourFlags.some(f => f.thunder),
      heavySnow: hourFlags.some(f => f.heavySnow),
      heavyRain: hourFlags.some(f => f.heavyRain),
      freezingRain: hourFlags.some(f => f.freezingRain),
      strongWind: hourFlags.some(f => f.strongWind),
      severeWind: hourFlags.some(f => f.severeWind),
    };

    return {
      ...m,
      available: validT.length > 0,
      temps: t, precs: p, precipProb: pp, sun: suns, codes: c, winds: w, gusts: g, wdir: dirs, times: timesSpan, hourFlags,
      nowVal: t[0],
      todayLow, todayHigh,
      totalPrecip: p.reduce((a, b) => a + b, 0),
      avgWind: w.reduce((a, b) => a + b, 0) / w.length,
      maxGust: Math.max(0, ...g),
      flags,
      anyExtreme: flags.thunder || flags.heavySnow || flags.heavyRain || flags.freezingRain || flags.severeWind,
    };
  });

  const header = `<div class="hero"><div class="hero-top">
      <div>
        <div class="hero-place">${escapeHtml(place.name)}${place.country ? `<span class="hero-place-country">, ${escapeHtml(place.country)}</span>` : ''}</div>
        <div class="day-switch">
          <button type="button" class="day-switch-btn${activeRange === 24 ? ' active' : ''}" data-hours="24">24h</button>
          <button type="button" class="day-switch-btn${activeRange === 72 ? ' active' : ''}" data-hours="72">72h</button>
        </div>
      </div>
      <div class="hero-right">
        <div class="hero-now" id="heroNow"></div>
        <div class="hero-meta" id="heroMeta"></div>
      </div>
    </div>
    <div id="heroBody"></div>
  </div>`;

  app.innerHTML = header;
  renderHero(perModel, air, astro);
  window.scrollTo(0, scrollY);
}

const HAZARDS = [
  { key: 'thunder',      label: 'Thunderstorms',   flagKey: 'thunder' },
  { key: 'severeWind',   label: 'Severe gusts (90+ km/h)', flagKey: 'severeWind' },
  { key: 'heavyRain',    label: 'Heavy rain',       flagKey: 'heavyRain' },
  { key: 'heavySnow',    label: 'Heavy snow',       flagKey: 'heavySnow' },
  { key: 'freezingRain', label: 'Freezing rain',    flagKey: 'freezingRain' },
  { key: 'strongWind',   label: 'Strong gusts (60+ km/h)', flagKey: 'strongWind' },
];

function renderHero(perModel, air, astro) {
  const box = $('#heroBody');
  const nowBox = $('#heroNow');
  const metaBox = $('#heroMeta');
  const avail = perModel.filter(m => m.available);
  if (!avail.length) {
    nowBox.innerHTML = '';
    metaBox.innerHTML = '';
    box.innerHTML = '<div class="no-data">No data available from any model for this location.</div>';
    lastAvailModels = null;
    return;
  }

  const nowTemps = avail.map(m => m.nowVal).filter(v => v !== null && v !== undefined);
  if (nowTemps.length) {
    const nowAvg = nowTemps.reduce((a, b) => a + b, 0) / nowTemps.length;
    const nowMin = Math.min(...nowTemps), nowMax = Math.max(...nowTemps);
    // "The" current condition is the modal weather code across models at
    // the first hour — majority wins, so a single drizzly outlier can't
    // hijack the glyph when five models say overcast.
    const codeCounts = new Map();
    avail.forEach(m => {
      const c = m.codes[0];
      if (c !== null && c !== undefined) codeCounts.set(c, (codeCounts.get(c) || 0) + 1);
    });
    let nowCode = null, bestCount = 0;
    codeCounts.forEach((count, code) => { if (count > bestCount) { bestCount = count; nowCode = code; } });
    // Today's low/high, averaged across models the same way nowAvg is.
    const lows = avail.map(m => m.todayLow).filter(v => v !== null && v !== undefined);
    const highs = avail.map(m => m.todayHigh).filter(v => v !== null && v !== undefined);
    const hlBits = [];
    if (highs.length) hlBits.push(`<span><span class="hl-tag">H</span> ${Math.round(highs.reduce((a, b) => a + b, 0) / highs.length)}°</span>`);
    if (lows.length) hlBits.push(`<span><span class="hl-tag">L</span> ${Math.round(lows.reduce((a, b) => a + b, 0) / lows.length)}°</span>`);
    const spreadTxt = nowMax - nowMin >= 1 ? `${Math.round(nowMin)}–${Math.round(nowMax)}°` : `${Math.round(nowAvg)}°`;
    nowBox.innerHTML = `<div class="hero-now-main">${nowCode !== null ? `<div class="hero-now-icon">${weatherEmoji(nowCode)}</div>` : ''}<div class="hero-now-val">${Math.round(nowAvg)}°</div>${hlBits.length ? `<div class="hero-now-hl">${hlBits.join('')}</div>` : ''}</div><div class="hero-now-range">${spreadTxt} across ${nowTemps.length} model${nowTemps.length === 1 ? '' : 's'}</div>`;
  } else {
    nowBox.innerHTML = '';
  }

  // Resolve the user's raw legend selection against the models actually
  // available here (see effectiveSelection). Every chart below takes this
  // resolved value, not selectedModels directly.
  const activeSel = effectiveSelection(avail);

  // The hero's meta row, one wrapping line under the big temperature:
  // today's sun/moon context first, then the whole-view forecast numbers
  // the chart captions used to carry below the charts (average wind and
  // peak gust, expected sunshine, air-quality peaks), then a faint tag
  // scoping the forecast items to the active 24h/72h window. Wind and
  // sunshine average over the filtered set (matching the hazard chips,
  // so they track the model filter); the air peaks come from CAMS, which
  // is a single model and ignores the filter.
  const metaItems = [];
  astroParts(astro).forEach(p => metaItems.push({ html: p }));
  const statsBase = activeSel ? avail.filter(m => activeSel.has(m.id)) : avail;
  const statHours = avail[0].times.length;
  if (statsBase.length) {
    const avgWind = statsBase.reduce((a, m) => a + (m.avgWind || 0), 0) / statsBase.length;
    const gustPeak = statsBase.reduce((best, m) => (m.maxGust > best.maxGust ? m : best), statsBase[0]);
    metaItems.push({ html: `🌬 ${Math.round(avgWind)} km/h · gusts ${Math.round(gustPeak.maxGust)} (${gustPeak.name})` });
    // Expected sunshine: per hour, the mean of the models that reported,
    // summed over the view — the same average buildSunChart paints.
    let totalSunSecs = 0, sunHoursCount = 0;
    for (let i = 0; i < statHours; i++) {
      const reporting = statsBase.map(m => m.sun ? m.sun[i] : null).filter(v => v !== null && v !== undefined);
      if (!reporting.length) continue;
      totalSunSecs += reporting.reduce((a, b) => a + b, 0) / reporting.length;
      sunHoursCount++;
    }
    if (sunHoursCount) metaItems.push({ html: `☀ ${(totalSunSecs / 3600).toFixed(1)} h sun` });
  }
  if (air && air.hourly && air.hourly.time) {
    // Peak each CAMS variable over the view's hours, matching the way
    // buildAirChart aligns the air API's timestamps to the chart's.
    const airIdx = new Map(air.hourly.time.map((t, i) => [t, i]));
    const peakOf = key => {
      let peak = null;
      for (const t of avail[0].times) {
        const i = airIdx.get(t);
        const arr = air.hourly[key];
        if (i === undefined || !arr) continue;
        const v = arr[i];
        if (v !== null && v !== undefined && (peak === null || v > peak)) peak = v;
      }
      return peak;
    };
    const aqiPeak = peakOf('european_aqi');
    const uvPeak = peakOf('uv_index');
    const aodPeak = peakOf('aerosol_optical_depth');
    const airBits = [];
    if (aqiPeak !== null) airBits.push(`AQI ${Math.round(aqiPeak)} (${eaqiInfo(aqiPeak).label})`);
    if (uvPeak !== null) airBits.push(`UV ${uvPeak.toFixed(1)} (${uvInfo(uvPeak)})`);
    if (aodPeak !== null) airBits.push(`haze ${aodPeak.toFixed(2)}`);
    if (airBits.length) metaItems.push({ html: airBits.join(' · '), title: 'Air-quality peaks over the same hours · CAMS via Open-Meteo (single model — not part of the model comparison)' });
  }
  metaItems.push({ html: `next ${statHours}h`, range: true });
  metaBox.innerHTML = metaItems.map(i => `<span class="hero-meta-item${i.range ? ' hero-meta-range' : ''}"${i.title ? ` title="${i.title}"` : ''}>${i.html}</span>`).join('');

  // Hazard chips recompute their counts/denominator against the filtered
  // set — a hazard only one of your selected models flags would otherwise
  // sit at "1/6", reading as a consensus long-shot when among your
  // selection it might be unanimous. But *which* chips appear is decided
  // once, from every available model, not the filtered set: if a chip's
  // presence itself flipped on every filter click, the row's height (and
  // everything below it) would jump around as you clicked through the
  // legend. So a hazard none of your selected models flags dims out
  // in place, matching the "gray, don't hide" approach the charts and
  // strip already use, rather than disappearing.
  const hazardBase = activeSel ? avail.filter(m => activeSel.has(m.id)) : avail;

  const hazardRows = HAZARDS.map(h => {
    const hits = hazardBase.filter(m => m.flags[h.flagKey]);
    const everFlagged = avail.some(m => m.flags[h.flagKey]);
    return { ...h, count: hits.length, models: hits, everFlagged };
  }).filter(h => h.everFlagged)
    .sort((a, b) => b.count - a.count);

  const chips = hazardRows.map(h => {
    const level = h.count === 0 ? 'dim' : (h.count >= hazardBase.length * 0.5 ? 'high' : 'low');
    return `<div class="hazard-chip hazard-${level}">
      <span class="hazard-dot"></span>
      <span class="hazard-label">${escapeHtml(h.label)}</span>
      <span class="hazard-count">${h.count}/${hazardBase.length}</span>
    </div>`;
  }).join('');

  const precipVals = avail.map(m => m.totalPrecip);
  const pMax = Math.max(...precipVals);

  const lo = 0, hi = Math.max(1, Math.ceil(pMax + 1));
  const range = hi - lo || 1;
  const sorted = [...avail].sort((a, b) => a.totalPrecip - b.totalPrecip);

  const dots = sorted.map((m, i) => {
    const pct = ((m.totalPrecip - lo) / range) * 100;
    const dimmed = activeSel && !activeSel.has(m.id);
    const boosted = activeSel && !dimmed;
    const dotColor = dimmed ? 'var(--ink-faint)' : m.color;
    const dotExtra = dimmed ? 'opacity:.5;' : (boosted ? 'width:18px;height:18px;top:43.5px;z-index:2;' : '');
    const valColor = dimmed ? 'var(--ink-faint)' : m.color;
    const valExtra = dimmed ? 'opacity:.55;' : (boosted ? 'font-weight:700;z-index:2;' : '');
    return `<button type="button" class="strip-dot" data-model="${m.id}" data-role="strip-dot" aria-pressed="${selectedModels.has(m.id)}" aria-label="Filter to ${escapeHtml(m.name)}" style="left:${pct}%; background:${dotColor}; ${dotExtra}" title="${m.name}: ${m.totalPrecip.toFixed(1)}mm"></button>
      <div class="strip-val" style="left:${pct}%; top:${(i % 3) * 14}px; color:${valColor}; ${valExtra}">${m.totalPrecip.toFixed(1)}mm</div>`;
  }).join('');

  // Legend doubles as the filter control. Selected/dimmed state is driven
  // by activeSel (so it only lights up for models actually present here);
  // availability is a separate, always-on look (gray dot, disabled, can't
  // be clicked) so "no data for this place" is never confusable with
  // "not part of the filter" — the checkmark still shows for a selected
  // model even when it happens to be unavailable at the current place, so
  // the user can see their pick was remembered.
  const legendItems = perModel.map(m => {
    const rawSelected = selectedModels.has(m.id);
    const classes = ['legend-item'];
    let title;
    if (!m.available) {
      classes.push('is-unavailable');
      title = `${m.name}: no data for this location`;
    } else if (activeSel) {
      if (activeSel.has(m.id)) { classes.push('is-selected'); title = `${m.name}: shown — click to remove from filter`; }
      else { classes.push('is-dimmed'); title = `${m.name}: click to add to filter`; }
    } else {
      title = `${m.name}: click to filter to just this model`;
    }
    return `<button type="button" class="${classes.join(' ')}" data-model="${m.id}" ${!m.available ? 'disabled' : ''} aria-pressed="${rawSelected}" title="${escapeHtml(title)}" style="--mc:${m.color}">
      <span class="legend-dot" style="background:${m.available ? m.color : 'var(--ink-faint)'};"></span>
      ${escapeHtml(m.name)}${rawSelected ? '<span class="legend-check" aria-hidden="true">&check;</span>' : ''}
    </button>`;
  }).join('');

  box.innerHTML = `
    <div class="hazard-row">${chips}</div>
    ${sectionHead('Weather models', "Six national forecast models plotted together. Click a model's name to filter every chart down to just that one (or a few) — the rest stay visible, just grayed out for context.")}
    <div class="legend">
      ${legendItems}
    </div>
    ${sectionHead('Temperature', 'Hourly temperature from each model over the selected time range. Where the lines diverge, the models disagree on how warm or cold it will get. Tap a line to filter to that model — tap again to remove it.')}
    <div class="temp-chart-wrap" id="tempChartHolder"></div>
    ${sectionHead('Precipitation', 'Top: total rainfall/snow each model expects over the whole view, one dot per model. Bottom: hourly forecast — darker bars mean more models agree on that amount (or, with a model filter active, bars are colored per model instead), the dot under each bar shows the average chance of rain that hour, and a ⚡ above an hour means at least one model forecasts thunderstorms then (bolder the more models agree). Tap a bar, or a dot on the total-spread line, to filter to that model.')}
    <div class="temp-chart-wrap">
      <div class="spread-block">
        <div class="sub-head">Total</div>
        <div class="strip">
          <div class="strip-line"></div>
          <div class="strip-tick" style="left:0%;"></div>
          <div class="strip-tick" style="left:100%;"></div>
          ${dots}
          <div class="strip-axis" style="left:0%;">${lo}mm</div>
          <div class="strip-axis" style="left:100%;">${hi}mm</div>
        </div>
      </div>
      <div class="sub-head">Hourly</div>
      <div id="precipChartHolder"></div>
    </div>
    ${sectionHead('Wind', 'Hourly sustained wind speed (km/h) from each model over the selected time range, drawn as one translucent filled area per model in its own color. Where the areas spread apart, the models disagree on how windy it will get. The arrow band under the chart shows the wind direction for each hour — where the wind blows toward, fainter the more the models disagree on the direction; hover an arrow for each model\'s own direction, given as the wind comes FROM, as on a weather map, plus the average speed. Tap a line to filter to that model — tap again to remove it.')}
    <div class="temp-chart-wrap"><div id="windChartHolder"></div></div>
    ${sectionHead('Sunshine', 'One square per hour, aligned with the charts above — the brighter the yellow, the more minutes of direct sunshine the models expect that hour (averaged across the models shown). Faint gray squares are hours with no sun expected at all; hover or tap a square for each model\'s own estimate.')}
    <div class="temp-chart-wrap"><div id="sunChartHolder"></div></div>
    ${air ? sectionHead('Air quality', 'Three strips aligned to the same hours — European AQI, UV index (WHO scale), and atmospheric haze/aerosol optical depth (the darker the square, the hazier). AQI and UV share one severity color ramp, blue (mild) through orange and red to purple (extreme); the legend maps it to both scales. Single CAMS model, so unlike the weather charts it is not affected by the model filter.', buildAirLegend()) : ''}
    ${air ? '<div class="temp-chart-wrap"><div id="airChartHolder"></div></div>' : ''}
  `;

  lastAvailModels = avail;
  renderResponsiveCharts();
}

function renderResponsiveCharts() {
  const avail = lastAvailModels;
  const tempHolder = $('#tempChartHolder');
  const precipHolder = $('#precipChartHolder');
  const sunHolder = $('#sunChartHolder');
  const windHolder = $('#windChartHolder');
  const airHolder = $('#airChartHolder');
  if (!avail || !tempHolder || !precipHolder || !sunHolder || !windHolder) return;
  const width = Math.max(260, Math.round(tempHolder.getBoundingClientRect().width));
  const selected = effectiveSelection(avail);
  tempHolder.innerHTML = buildLineChart(avail, 'temps', { unit: '°', width, selected });
  precipHolder.innerHTML = buildPrecipChart(avail, width, selected);
  sunHolder.innerHTML = buildSunChart(avail, width, selected);
  windHolder.innerHTML = buildWindChart(avail, width, selected);
  if (airHolder && lastAir) {
    airHolder.innerHTML = buildAirChart(lastAir.hourly, avail[0].times, width);
  }
}

function buildLineChart(avail, seriesKey, opts) {
  const { unit = '', domainMin = null, domainMax = null, height = 220, width = 1000, selected = null } = opts || {};
  const n = avail[0][seriesKey].length;
  const isMultiDay = n > 24;
  // A multi-day chart gets a taller bottom band (day axis under the hour
  // axis) — add that height back rather than shrinking the plot area.
  const W = width, H = height + (isMultiDay ? 14 : 0);
  const PAD_L = CHART_PAD_L, PAD_R = CHART_PAD_R, PAD_T = 16, PAD_B = isMultiDay ? 40 : 26;
  const plotW = W - PAD_L - PAD_R;
  const plotH = H - PAD_T - PAD_B;

  const allVals = [];
  avail.forEach(m => m[seriesKey].forEach(v => { if (v !== null && v !== undefined) allVals.push(v); }));
  if (!allVals.length) allVals.push(domainMin ?? 0, domainMax ?? (domainMin ?? 0) + 1);
  const vMin = domainMin !== null ? domainMin : Math.floor(Math.min(...allVals) - 1);
  const vMax = domainMax !== null ? domainMax : Math.ceil(Math.max(...allVals) + 1);
  const vRange = (vMax - vMin) || 1;

  const xFor = chartXFor(PAD_L, plotW, n);
  const yFor = v => PAD_T + plotH - ((v - vMin) / vRange) * plotH;

  const steps = 4;
  const gridLines = [];
  for (let s = 0; s <= steps; s++) {
    const val = vMin + (vRange * s / steps);
    const y = yFor(val);
    gridLines.push(`<line x1="${PAD_L}" y1="${y.toFixed(1)}" x2="${W - PAD_R}" y2="${y.toFixed(1)}" stroke="var(--grid-line)" stroke-width="1"/>
      <text x="${W - PAD_R + 8}" y="${(y + 3).toFixed(1)}" font-size="10" fill="var(--ink)" font-family="IBM Plex Mono">${Math.round(val)}${unit}</text>`);
  }

  const times = avail[0].times;
  const axis = buildXAxis(times, n, plotW, plotH, PAD_L, PAD_T);

  // With a filter active, draw non-selected lines first (low opacity, thin)
  // so they sit underneath, then the selected ones last (full opacity,
  // thicker) so they paint on top — SVG has no z-index, only paint order.
  const order = selected ? [...avail].sort((a, b) => (selected.has(a.id) ? 1 : 0) - (selected.has(b.id) ? 1 : 0)) : avail;
  const lines = order.map(m => {
    const series = m[seriesKey];
    let path = '';
    series.forEach((v, i) => {
      if (v === null || v === undefined) return;
      const x = xFor(i), y = yFor(v);
      path += (path === '' ? `M${x.toFixed(1)},${y.toFixed(1)}` : ` L${x.toFixed(1)},${y.toFixed(1)}`);
    });
    const isSel = !selected || selected.has(m.id);
    const opacity = selected ? (isSel ? 1 : 0.25) : 0.9;
    const strokeWidth = selected ? (isSel ? 2.5 : 1.5) : 2;
    return `<path d="${path}" fill="none" stroke="${m.color}" stroke-width="${strokeWidth}" opacity="${opacity}" data-model="${m.id}" data-role="model-line"/>`;
  }).join('');

  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block;touch-action:manipulation;">
    ${axis.vLines}
    ${gridLines.join('')}
    ${lines}
    ${axis.dayLines}
    ${axis.hourLabels}
    ${axis.dayLabels}
  </svg>`;
}

// One column per hour, with every model drawn as its own bar in that
// model's color, fully opaque, overlaid on the same baseline. Solid bars
// don't blend the way translucent ones do — paint order alone decides what
// shows through — so within each hour the bars are sorted tallest-first:
// the shorter (lower) bars paint last and sit in front of the taller ones
// behind them. That turns the overlap into a stack of crisp color bands,
// one per model, so each value reads in its true color instead of a muddy
// blend of its neighbors. (Two models with identical values share a band —
// the later-drawn one wins — which is why the confidence dot below still
// reports the model count.) A confidence dot beneath the axis carries the
// separate question of how likely the models think rain is at all, on its
// own color.
const BAR_LAYER_OPACITY = 1;
// Filtered-mode alternative to the above: once a model filter is active,
// "which models agree" stops being the question — "what do my chosen
// models say, against the rest" is. Bars keep their model colors, but
// non-selected models are pushed down to a faint wash and selected ones
// raised to near-solid, and selected bars are drawn last per hour so they
// paint over the dimmed ones they overlap rather than being buried under
// them.
const BAR_FILTERED_DIMMED_OPACITY = 0.18;
const BAR_FILTERED_SELECTED_OPACITY = 0.85;
const CONFIDENCE_DOT_ROW = 14; // px reserved between the plot and the hour-label row
// Mirrors CONFIDENCE_DOT_ROW, but above the plot rather than below it: a
// band reserved for the per-hour thunderbolt markers so they never crowd
// the topmost gridline/value label.
const THUNDER_ROW = 14;
function buildPrecipChart(avail, width, selected) {
  const n = avail[0].times.length;
  const isMultiDay = n > 24;
  const dotOffset = CONFIDENCE_DOT_ROW;
  const thunderOffset = THUNDER_ROW;
  const W = width || 1000, H = 220 + dotOffset + thunderOffset + (isMultiDay ? 14 : 0);
  const PAD_L = CHART_PAD_L, PAD_R = CHART_PAD_R, PAD_T = 16 + thunderOffset, PAD_B = (isMultiDay ? 40 : 26) + dotOffset;
  const plotW = W - PAD_L - PAD_R;
  const plotH = H - PAD_T - PAD_B;
  const colW = plotW / n;
  // Gap shrinks with the column itself so barW never exceeds colW — at 72h
  // on a narrow phone, colW can drop below the old fixed 6px floor, which
  // made bars wider than their own column and bleed into neighboring hours.
  const barW = Math.max(1, colW - Math.min(4, colW * 0.25));
  // Same overlap problem as barW, one column down: a fixed r=3 (6px wide)
  // dot is wider than colW once 72 hours are squeezed into a phone screen,
  // so neighboring hours' confidence dots ran into each other. Cap the
  // radius to the column's own width, leaving a 1px gap either side.
  const dotR = Math.min(3, Math.max(1, colW / 2 - 0.5));

  const times = avail[0].times;
  const hours = [];
  for (let i = 0; i < n; i++) {
    // Keep each amount tied to its model (id/color) so both the unfiltered
    // and filtered branches can draw each bar in its own model's color.
    const amounts = avail.map(m => ({ id: m.id, color: m.color, v: m.precs[i] || 0 })).filter(a => a.v > 0);
    const probs = avail.map(m => m.precipProb[i]).filter(p => p !== null && p !== undefined);
    const avgProb = probs.length ? probs.reduce((a, b) => a + b, 0) / probs.length : null;
    // Same unfiltered `avail` set the confidence dots read from, so the
    // thunder marker's "n of total" always means all models, not just the
    // ones a model filter happens to have selected.
    const thunderModels = avail.filter(m => m.hourFlags[i]?.thunder).map(m => m.name);
    hours.push({ amounts, avgProb, reporting: probs.length, total: avail.length, thunderModels });
  }

  const vMax = Math.max(1, Math.ceil(Math.max(0, ...hours.flatMap(h => h.amounts.map(a => a.v)))));
  const xFor = chartXFor(PAD_L, plotW, n);
  const yFor = v => PAD_T + plotH - (Math.max(0, v) / vMax) * plotH;
  const plotBottom = PAD_T + plotH;

  const steps = 4;
  const gridLines = [];
  for (let s = 0; s <= steps; s++) {
    const val = vMax * s / steps;
    const y = yFor(val);
    gridLines.push(`<line x1="${PAD_L}" y1="${y.toFixed(1)}" x2="${W - PAD_R}" y2="${y.toFixed(1)}" stroke="var(--grid-line)" stroke-width="1"/>
      <text x="${W - PAD_R + 8}" y="${(y + 3).toFixed(1)}" font-size="10" fill="var(--ink)" font-family="IBM Plex Mono">${val.toFixed(val < 2 ? 1 : 0)}mm</text>`);
  }

  const axis = buildXAxis(times, n, plotW, plotH, PAD_L, PAD_T, dotOffset);
  // Baseline for the thunderbolt glyphs, sitting in the THUNDER_ROW band
  // just above the plot's top edge (and its topmost gridline) rather than
  // on it.
  const thunderY = PAD_T - 4;

  const bars = [];
  const dots = [];
  const thunderMarks = [];
  hours.forEach((h, i) => {
    const x = xFor(i);
    const hourLabel = times[i] ? hourTooltipLabel(times[i], n) : '';

    // Aggregate tooltip text for this hour, computed up front because every
    // visible bar in the hour now carries its own copy of it (see below) —
    // the transparent overlay rect alone can no longer be the tooltip
    // carrier now that it must let clicks through to the bars.
    let hourTitle = '';
    if (h.amounts.length) {
      const vals = h.amounts.map(a => a.v);
      const min = Math.min(...vals), max = Math.max(...vals);
      const range = min === max ? `${min.toFixed(1)}mm` : `${min.toFixed(1)}–${max.toFixed(1)}mm`;
      hourTitle = `${hourLabel}: ${range} · ${h.amounts.length} of ${h.total} models predict rain`;
    }

    if (selected) {
      // Selected models drawn last so they paint on top of the dimmed rest
      // at the same x; within each group, taller first / shorter last keeps
      // the "lower bars in front" rule so a short bar is never buried under
      // a taller one of the same selection state.
      const ordered = [...h.amounts].sort((a, b) => {
        const sa = selected.has(a.id) ? 1 : 0;
        const sb = selected.has(b.id) ? 1 : 0;
        if (sa !== sb) return sa - sb;
        return b.v - a.v;
      });
      ordered.forEach(a => {
        const y = yFor(a.v);
        const barH = plotBottom - y;
        const isSel = selected.has(a.id);
        bars.push(`<rect x="${(x - barW / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="1.5" fill="${a.color}" opacity="${isSel ? BAR_FILTERED_SELECTED_OPACITY : BAR_FILTERED_DIMMED_OPACITY}" data-model="${a.id}" data-role="precip-bar"><title>${hourTitle}</title></rect>`);
      });
    } else {
      // Tallest first, shortest last — SVG paints later elements on top, so
      // the shorter (lower) bar at this hour ends up in front of the taller
      // ones behind it. With solid model-colored bars, this order is what
      // turns the overlap into clean color bands: each model's bar stays
      // visible from the baseline up to its own height instead of being
      // painted over by a taller neighbor.
      const ordered = [...h.amounts].sort((a, b) => b.v - a.v);
      ordered.forEach(a => {
        const y = yFor(a.v);
        const barH = plotBottom - y;
        bars.push(`<rect x="${(x - barW / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="1.5" fill="${a.color}" opacity="${BAR_LAYER_OPACITY}" data-model="${a.id}" data-role="precip-bar"><title>${hourTitle}</title></rect>`);
      });
    }
    if (hourTitle) {
      // This transparent overlay used to be the sole tooltip hit-rect; the
      // visible bars are tappable now (and carry the same <title> for
      // desktop hover), so it must not swallow their clicks.
      const max = Math.max(...h.amounts.map(a => a.v));
      const hitY = yFor(max);
      bars.push(`<rect x="${(x - barW / 2).toFixed(1)}" y="${hitY.toFixed(1)}" width="${barW.toFixed(1)}" height="${(plotBottom - hitY).toFixed(1)}" fill="transparent" pointer-events="none"><title>${hourTitle}</title></rect>`);
    }

    if (h.avgProb !== null) {
      const opacity = 0.15 + (Math.max(0, Math.min(100, h.avgProb)) / 100) * 0.75;
      const dotY = plotBottom + dotOffset / 2;
      const title = `${hourLabel}: ${Math.round(h.avgProb)}% avg chance of rain (${h.reporting}/${h.total} models)`;
      dots.push(`<circle cx="${x.toFixed(1)}" cy="${dotY.toFixed(1)}" r="${dotR.toFixed(1)}" fill="var(--c-confidence)" opacity="${opacity.toFixed(2)}"><title>${title}</title></circle>`);
    }

    if (h.thunderModels.length) {
      // Same fade-by-agreement formula as the confidence dot above: a lone
      // outlier model reads faint, unanimous agreement reads solid.
      const opacity = 0.15 + (h.thunderModels.length / h.total) * 0.75;
      const title = `${hourLabel}: thunderstorms predicted by ${h.thunderModels.length} of ${h.total} models (${h.thunderModels.join(', ')})`;
      thunderMarks.push(`<text x="${x.toFixed(1)}" y="${thunderY.toFixed(1)}" font-size="11" text-anchor="middle" opacity="${opacity.toFixed(2)}">⚡<title>${title}</title></text>`);
    }
  });

  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block;touch-action:manipulation;">
    ${axis.vLines}
    ${gridLines.join('')}
    ${bars.join('')}
    <line x1="${PAD_L}" y1="${plotBottom.toFixed(1)}" x2="${W - PAD_R}" y2="${plotBottom.toFixed(1)}" stroke="var(--grid-line)" stroke-width="1"/>
    ${dots.join('')}
    ${thunderMarks.join('')}
    ${axis.dayLines}
    ${axis.hourLabels}
    ${axis.dayLabels}
  </svg>`;
}

// A single-row sunshine heatmap: one square per hour on the same hour
// columns the temperature and precipitation charts use (same pads, same
// chartXFor), so all three line up exactly. Each square is the average
// fraction of direct sunshine in that hour across the models shown —
// `sunshine_duration` counts the seconds of the preceding hour during
// which direct irradiance exceeded the WMO 120 W/m² threshold, so
// dividing by 3600 gives a clean 0–1 "how sunny is this hour". That
// fraction drives the yellow's opacity (the same opacity-scale trick as
// the precipitation confidence dots); zero-sun hours (night or solid
// overcast) fall back to a faint neutral square so the strip stays
// continuous and reads "hour exists, no sun", while an hour no model
// reported on at all is left as a genuine gap. With a model filter active
// the average is taken over the selected models only, matching the way
// the hazard chips recompute.
const SUN_CELL_ROW = 20; // px height of the strip
function buildSunChart(avail, width, selected) {
  const n = avail[0].times.length;
  const isMultiDay = n > 24;
  const base = selected ? avail.filter(m => selected.has(m.id)) : avail;
  const W = width || 1000;
  const PAD_L = CHART_PAD_L, PAD_R = CHART_PAD_R, PAD_T = 16;
  const PAD_B = isMultiDay ? 40 : 26; // same label band as buildLineChart
  const plotW = W - PAD_L - PAD_R;
  const rowH = SUN_CELL_ROW;
  const H = PAD_T + rowH + PAD_B;
  const colW = plotW / n;
  // Same column-gap logic as the precipitation bars, so the squares never
  // bleed into a neighbouring hour on a narrow 72h phone screen.
  const cellW = Math.max(1, colW - Math.min(4, colW * 0.25));
  const xFor = chartXFor(PAD_L, plotW, n);
  const times = avail[0].times;
  const axis = buildXAxis(times, n, plotW, rowH, PAD_L, PAD_T);

  const cells = [];
  for (let i = 0; i < n; i++) {
    const reporting = base
      .map(m => ({ name: m.name, v: m.sun ? m.sun[i] : null }))
      .filter(d => d.v !== null && d.v !== undefined);
    if (!reporting.length) continue; // no model reported this hour → gap
    const meanSecs = reporting.reduce((a, d) => a + d.v, 0) / reporting.length;
    const frac = Math.max(0, Math.min(1, meanSecs / 3600));
    const mins = Math.round(meanSecs / 60);
    const hourLabel = times[i] ? hourTooltipLabel(times[i], n) : '';
    const breakdown = reporting.map(d => `${d.name} ${Math.round(d.v / 60)} min`).join(' · ');
    const title = `${hourLabel}: ${mins ? `≈${mins} min sunshine` : 'no sunshine forecast'} (avg of ${reporting.length} model${reporting.length === 1 ? '' : 's'}) — ${breakdown}`;
    const attrs = `x="${(xFor(i) - cellW / 2).toFixed(1)}" y="${PAD_T}" width="${cellW.toFixed(1)}" height="${rowH}" rx="2"`;
    if (frac > 0) {
      // Floor mirrors the confidence dots' scale; a full hour of sun is solid.
      const opacity = 0.15 + 0.85 * frac;
      cells.push(`<rect ${attrs} fill="var(--c-sun)" opacity="${opacity.toFixed(2)}"><title>${title}</title></rect>`);
    } else {
      cells.push(`<rect ${attrs} fill="var(--grid-line)" opacity="0.35"><title>${title}</title></rect>`);
    }
  }

  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block;touch-action:manipulation;">
    ${axis.vLines}
    ${cells.join('')}
    ${axis.dayLines}
    ${axis.hourLabels}
    ${axis.dayLabels}
  </svg>`;
}

// ── Wind ──────────────────────────────────────────────────────────
// An area chart on the same hour columns as every other chart, with
// the same plot geometry as the temperature chart (same 220 px plot,
// same pads), so the wind plot area is exactly as tall as the
// temperature and precipitation ones. Each model's hourly sustained
// wind speed is a translucent filled area in the model's color with
// its stroke drawn as a line on top — the divergence story the
// temperature lines tell, read as gaps between colored bands instead
// of crossing lines. Gusts live in the hero stats and the hazard
// chips; they systematically run higher than the sustained speeds
// plotted here.

// Fill opacities for the three selection states. Unfiltered is low
// because all six areas stack near the baseline (calm hours overlap
// everyone's fill); a filter active raises the chosen models' fill and
// washes the rest out to almost nothing.
const WIND_FILL_OPACITY = 0.10;
const WIND_FILL_SELECTED_OPACITY = 0.22;
const WIND_FILL_DIMMED_OPACITY = 0.04;

// Height of the direction band between the plot's baseline and the
// hour labels — the same reserved-strip pattern as the precipitation
// chart's confidence dots (CONFIDENCE_DOT_ROW), so the band adds
// annotation space below the plot without shrinking the plot area the
// height parity with the temperature chart is about.
const DIR_ROW = 18;

// Circular mean of directions in degrees (0–360). A plain arithmetic mean
// is wrong twice over for angles: 350° and 10° average to 180° — the exact
// opposite of the true answer, north — and the wrap at 360/0 breaks the
// averaging outright. Summing unit vectors and taking atan2 of the
// resultant has neither problem.
function circMeanDeg(vals) {
  let s = 0, c = 0;
  for (const v of vals) {
    const r = v * Math.PI / 180;
    s += Math.sin(r); c += Math.cos(r);
  }
  return (Math.atan2(s, c) * 180 / Math.PI + 360) % 360;
}

// Shortest angular distance between two directions, 0–180. The mean of
// these across models is the direction spread the arrows' fade encodes.
function angDistDeg(a, b) {
  const d = Math.abs(a - b) % 360;
  return d > 180 ? 360 - d : d;
}

const COMPASS16 = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const degToCompass = deg => COMPASS16[Math.round((((deg % 360) + 360) % 360) / 22.5) % 16];

// Hours whose (filtered-set) average sustained speed falls below this are
// "calm" for the direction band's purposes — a direction is meaningless
// at ~zero wind, so those hours draw a small neutral dot instead of an
// arrow pointing wherever the models' noise happens to sum.
const CALM_KMH = 2;

function buildWindChart(avail, width, selected) {
  const n = avail[0].times.length;
  const isMultiDay = n > 24;
  const W = width || 1000;
  const H = 220 + DIR_ROW + (isMultiDay ? 14 : 0);
  const PAD_L = CHART_PAD_L, PAD_R = CHART_PAD_R, PAD_T = 16, PAD_B = (isMultiDay ? 40 : 26) + DIR_ROW;
  const plotW = W - PAD_L - PAD_R;
  const plotH = H - PAD_T - PAD_B;

  // Scale from every model's values, not just the filtered set, so the
  // y-axis doesn't jump when a filter is toggled — same choice as the
  // temperature chart. Floored at 30 km/h so a near-calm day doesn't
  // paint every area nearly solid.
  let top = 0;
  avail.forEach(m => m.winds.forEach(v => { if (v !== null && v !== undefined && v > top) top = v; }));
  const vMax = Math.max(30, Math.ceil(top));

  const xFor = chartXFor(PAD_L, plotW, n);
  const yFor = v => PAD_T + plotH - (Math.max(0, v) / vMax) * plotH;
  const plotBottom = PAD_T + plotH;

  const times = avail[0].times;
  const axis = buildXAxis(times, n, plotW, plotH, PAD_L, PAD_T, DIR_ROW);

  const steps = 4;
  const gridLines = [];
  for (let s = 0; s <= steps; s++) {
    const val = vMax * s / steps;
    const y = yFor(val);
    gridLines.push(`<line x1="${PAD_L}" y1="${y.toFixed(1)}" x2="${W - PAD_R}" y2="${y.toFixed(1)}" stroke="var(--grid-line)" stroke-width="1"/>
      <text x="${W - PAD_R + 8}" y="${(y + 3).toFixed(1)}" font-size="10" fill="var(--ink)" font-family="IBM Plex Mono">${Math.round(val)}</text>`);
  }

  // Same paint-order trick as the temperature lines: dimmed models
  // first, selected ones last, so the chosen models sit on top. Fills
  // and strokes are separate passes so no fill ever covers a line — SVG
  // has no z-index, only paint order. The fills ignore pointer events
  // entirely: the tap-to-filter handler picks the nearest
  // data-role="model-line" stroke geometrically, exactly as it does for
  // the temperature chart.
  const order = selected ? [...avail].sort((a, b) => (selected.has(a.id) ? 1 : 0) - (selected.has(b.id) ? 1 : 0)) : avail;
  const fills = [];
  const strokes = [];
  order.forEach(m => {
    const isSel = !selected || selected.has(m.id);
    const fillOpacity = selected ? (isSel ? WIND_FILL_SELECTED_OPACITY : WIND_FILL_DIMMED_OPACITY) : WIND_FILL_OPACITY;
    const strokeWidth = selected ? (isSel ? 2.5 : 1.5) : 2;
    const strokeOpacity = selected ? (isSel ? 1 : 0.25) : 0.9;
    // Contiguous runs of reported hours: each run gets its own closed
    // area (down to the baseline and back) and its own line, mirroring
    // how buildLineChart leaves genuine gaps where a model reports
    // nothing.
    let run = [];
    const flush = () => {
      if (run.length < 2) { run = []; return; }
      const line = run.map((pt, k) => `${k === 0 ? 'M' : 'L'}${xFor(pt.i).toFixed(1)},${yFor(pt.v).toFixed(1)}`).join('');
      const x0 = xFor(run[0].i), x1 = xFor(run[run.length - 1].i);
      const area = `M${x0.toFixed(1)},${plotBottom.toFixed(1)}` +
        run.map(pt => ` L${xFor(pt.i).toFixed(1)},${yFor(pt.v).toFixed(1)}`).join('') +
        ` L${x1.toFixed(1)},${plotBottom.toFixed(1)} Z`;
      const title = `${m.name}: avg ${Math.round(m.avgWind)} km/h sustained · peak gust ${Math.round(m.maxGust)} km/h`;
      fills.push(`<path d="${area}" fill="${m.color}" fill-opacity="${fillOpacity}" stroke="none" pointer-events="none"/>`);
      strokes.push(`<path d="${line}" fill="none" stroke="${m.color}" stroke-width="${strokeWidth}" opacity="${strokeOpacity}" data-model="${m.id}" data-role="model-line"><title>${title}</title></path>`);
      run = [];
    };
    m.winds.forEach((v, i) => {
      if (v === null || v === undefined) { flush(); return; }
      run.push({ i, v });
    });
    flush();
  });

  // Direction band: one arrow per hour in the reserved strip between
  // the plot's baseline and the hour labels. The arrow points where the
  // wind blows toward; the tooltip gives the FROM notation a weather
  // map uses. Opacity is agreement: solid means the models agree on
  // direction, faint means they scatter (same fade-by-agreement idea as
  // the confidence dots). Everything averages the filtered set — speed
  // and direction are averages, not counts — and hours no model
  // reported on are left as genuine gaps.
  const base = selected ? avail.filter(m => selected.has(m.id)) : avail;
  const colW = plotW / n;
  const s = Math.max(2.5, Math.min(6, colW / 2 - 0.5, DIR_ROW / 2 - 2.5));
  const cy = plotBottom + DIR_ROW / 2;
  const dirArrows = [];
  for (let i = 0; i < n; i++) {
    const speeds = base.map(m => m.winds[i]).filter(v => v !== null && v !== undefined);
    if (!speeds.length) continue; // no model reported this hour → gap
    const avg = speeds.reduce((a, b) => a + b, 0) / speeds.length;
    const x = xFor(i);
    const hourLabel = times[i] ? hourTooltipLabel(times[i], n) : '';
    if (avg < CALM_KMH) {
      const title = `${hourLabel}: calm (under ${CALM_KMH} km/h)`;
      dirArrows.push(`<circle cx="${x.toFixed(1)}" cy="${cy.toFixed(1)}" r="${Math.max(1, s * 0.4).toFixed(1)}" fill="var(--ink)" opacity="0.55"><title>${title}</title></circle>`);
      continue;
    }
    const reporting = base
      .map(m => ({ name: m.name, dir: m.wdir ? m.wdir[i] : null }))
      .filter(d => d.dir !== null && d.dir !== undefined);
    if (!reporting.length) continue; // speeds but no direction from anyone
    const mean = circMeanDeg(reporting.map(d => d.dir));
    const spread = reporting.reduce((a, d) => a + angDistDeg(d.dir, mean), 0) / reporting.length;
    const opacity = (0.45 + 0.55 * Math.max(0, 1 - spread / 90)).toFixed(2);
    const toward = (mean + 180) % 360;
    const breakdown = reporting.map(d => `${d.name} ${degToCompass(d.dir)}`).join(' · ');
    const title = `${hourLabel}: ${Math.round(avg)} km/h from ${degToCompass(mean)} (${Math.round(mean)}°), spread ${Math.round(spread)}° across ${reporting.length} model${reporting.length === 1 ? '' : 's'} — ${breakdown}`;
    dirArrows.push(`<path d="M0,${(-s).toFixed(1)} L${(s * 0.62).toFixed(1)},${(s * 0.78).toFixed(1)} L0,${(s * 0.34).toFixed(1)} L${(-s * 0.62).toFixed(1)},${(s * 0.78).toFixed(1)} Z" fill="var(--ink)" opacity="${opacity}" transform="translate(${x.toFixed(1)},${cy.toFixed(1)}) rotate(${toward.toFixed(1)})"><title>${title}</title></path>`);
  }

  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block;touch-action:manipulation;">
    ${axis.vLines}
    ${gridLines.join('')}
    ${fills.join('')}
    ${strokes.join('')}
    ${dirArrows.join('')}
    ${axis.dayLines}
    ${axis.hourLabels}
    ${axis.dayLabels}
  </svg>`;
}

// ── Air quality ────────────────────────────────────────────────────────
// Three single-row heatmaps stacked in one SVG, using the same hour
// columns as every other chart. Unlike the sunshine strip there is one
// value per hour from a single source (CAMS), so no model averaging and
// no reaction to the model filter. Alignment is by timestamp string
// (both API calls use timezone=auto for the same coordinates, so the
// strings match); an hour the air API doesn't cover is a genuine gap.

// One shared six-step severity ramp — blue → light blue → orange → red →
// dark red → purple — used by both the AQI bands and the UV ramp so the
// two strips (and the consolidated legend) speak the same color language.
const AQ_RAMP = ['#8fd0f0', '#4fa8e8', '#ffa726', '#ff5050', '#a32020', '#7d2181'];

// European AQI bands: value → ramp color + plain-language label.
const EAQI_BANDS = [
  [20, AQ_RAMP[0], 'good'],
  [40, AQ_RAMP[1], 'fair'],
  [60, AQ_RAMP[2], 'moderate'],
  [80, AQ_RAMP[3], 'poor'],
  [100, AQ_RAMP[4], 'very poor'],
  [Infinity, AQ_RAMP[5], 'extremely poor'],
];
function eaqiInfo(v) {
  for (const [limit, color, label] of EAQI_BANDS) if (v < limit) return { color, label };
  return EAQI_BANDS[EAQI_BANDS.length - 1].slice(1);
}

// UV descriptor on the WHO scale (0-2 low … 11+ extreme).
function uvInfo(v) {
  if (v < 3) return 'low';
  if (v < 6) return 'moderate';
  if (v < 8) return 'high';
  if (v < 11) return 'very high';
  return 'extreme';
}

// UV color ramp interpolates the shared AQ ramp between WHO reference
// points 0, 2, 5, 7, 9 and 11 (low → extreme).
const UV_STOPS = [[0].concat(AQ_RAMP[0]), [2].concat(AQ_RAMP[1]), [5].concat(AQ_RAMP[2]), [7].concat(AQ_RAMP[3]), [9].concat(AQ_RAMP[4]), [11].concat(AQ_RAMP[5])]
  .map(([x, hex]) => [x, parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)]);
function uvColor(v) {
  const x = Math.max(0, Math.min(11, v));
  for (let s = 0; s < UV_STOPS.length - 1; s++) {
    const [x0, r0, g0, b0] = UV_STOPS[s];
    const [x1, r1, g1, b1] = UV_STOPS[s + 1];
    if (x >= x0 && x <= x1) {
      const t = x1 === x0 ? 0 : (x - x0) / (x1 - x0);
      const c = (a, b) => Math.round(a + (b - a) * t);
      return `rgb(${c(r0, r1)},${c(g0, g1)},${c(b0, b1)})`;
    }
  }
  return AQ_RAMP[5];
}

// Haze (aerosol optical depth) is dimensionless and roughly 0-1+; clear
// sky ≈ 0.0-0.1, heavy haze/dust > 0.5. A linear scale would leave most
// hours nearly invisible, so opacity follows the square root.
function aodOpacity(v) {
  return 0.10 + 0.90 * Math.sqrt(Math.max(0, Math.min(1, v)));
}

const AIR_CELL_ROW = 20; // matches SUN_CELL_ROW so the strips line up
function buildAirChart(airHourly, times, width) {
  const n = times.length;
  const isMultiDay = n > 24;
  const W = width || 1000;
  const PAD_L = CHART_PAD_L, PAD_R = CHART_PAD_R, PAD_T = 16;
  const PAD_B = isMultiDay ? 40 : 26;
  const plotW = W - PAD_L - PAD_R;
  const xFor = chartXFor(PAD_L, plotW, n);
  const colW = plotW / n;
  const cellW = Math.max(1, colW - Math.min(4, colW * 0.25));

  // Map the air API's timestamps to its own indices, then read through the
  // chart's (model) hour columns so everything shares one x-axis.
  const airIdx = new Map((airHourly.time || []).map((t, i) => [t, i]));
  const at = key => times.map(t => {
    const i = airIdx.get(t);
    if (i === undefined) return null;
    const v = airHourly[key] ? airHourly[key][i] : null;
    return (v === null || v === undefined) ? null : v;
  });

  const rows = [
    { key: 'european_aqi', label: 'European AQI', series: at('european_aqi') },
    { key: 'uv_index', label: 'UV index', series: at('uv_index') },
    { key: 'aerosol_optical_depth', label: 'Haze (aerosol depth)', series: at('aerosol_optical_depth') },
  ];

  const LABEL_H = 11, GAP = 7;
  const bandH = LABEL_H + AIR_CELL_ROW + GAP;
  const rowsH = rows.length * bandH - GAP;
  const H = PAD_T + rowsH + PAD_B;
  const axis = buildXAxis(times, n, plotW, rowsH, PAD_L, PAD_T);

  let svg = axis.vLines;
  rows.forEach((row, r) => {
    const rowTop = PAD_T + r * bandH + LABEL_H;
    svg += `<text x="${PAD_L}" y="${rowTop - 3}" font-size="9" fill="var(--ink-dim)" font-family="IBM Plex Mono">${row.label}</text>`;
    for (let i = 0; i < n; i++) {
      const v = row.series[i];
      if (v === null) continue; // hour the air API doesn't cover → gap
      const hourLabel = times[i] ? hourTooltipLabel(times[i], n) : '';
      const x = (xFor(i) - cellW / 2).toFixed(1);
      const attrs = `x="${x}" y="${rowTop}" width="${cellW.toFixed(1)}" height="${AIR_CELL_ROW}" rx="2"`;
      let cell;
      if (row.key === 'european_aqi') {
        const { color, label } = eaqiInfo(v);
        cell = `<rect ${attrs} fill="${color}"><title>${hourLabel}: AQI ${Math.round(v)} (${label})</title></rect>`;
      } else if (row.key === 'uv_index') {
        const info = uvInfo(v);
        const opacity = (0.20 + 0.80 * Math.max(0, Math.min(1, v / 11))).toFixed(2);
        cell = `<rect ${attrs} fill="${uvColor(v)}" opacity="${opacity}"><title>${hourLabel}: UV ${v.toFixed(1)} (${info})</title></rect>`;
      } else {
        const opacity = aodOpacity(v).toFixed(2);
        const fill = v < 0.15 ? 'var(--grid-line)' : '#8ea0b8';
        cell = `<rect ${attrs} fill="${fill}" opacity="${v < 0.15 ? 0.35 : opacity}"><title>${hourLabel}: aerosol optical depth ${v.toFixed(2)} (${v < 0.15 ? 'clear' : v < 0.5 ? 'some haze' : 'hazy'})</title></rect>`;
      }
      svg += cell;
    }
  });
  svg += axis.dayLines + axis.hourLabels + axis.dayLabels;

  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block;touch-action:manipulation;">
    ${svg}
  </svg>`;
}

// Color legend, shown inside the section's (i) tooltip rather than below
// the chart. AQI bands and UV reference points share the same six colors,
// so each swatch carries both scales (see AQ_RAMP); the haze row samples
// its opacity scale. Matches the SVG fill values exactly.
function buildAirLegend() {
  const sw = (color, label, opacity) =>
    `<span class="aq-legend-item" title="${escapeHtml(label)}"><span class="aq-legend-sw" style="background:${color};${opacity ? `opacity:${opacity};` : ''}"></span>${escapeHtml(label)}</span>`;
  const UV_POINTS = [0, 2, 5, 7, 9, 11];
  return `<div class="aq-legend">
    <div class="aq-legend-row"><span class="aq-legend-lead">AQI / UV</span>${EAQI_BANDS.map(([limit, color, label], i) =>
      sw(color, `${label === 'extremely poor' ? '100+' : '<' + limit} / ${UV_POINTS[i] === 11 ? '11+' : UV_POINTS[i]}`)).join('')}</div>
    <div class="aq-legend-row"><span class="aq-legend-lead">Haze</span>${[0, 0.25, 0.5, 0.75, 1].map(v =>
      sw(v < 0.15 ? 'var(--grid-line)' : '#8ea0b8', v.toFixed(2), v < 0.15 ? '0.35' : aodOpacity(v).toFixed(2))).join('')}</div>
  </div>`;
}

// load a remembered place if one was saved, otherwise default to Vienna, Austria
const remembered = loadRememberedPlace();
if (remembered) {
  rememberCheckbox.checked = true;
  loadPlace(remembered);
  searchInput.value = `${remembered.name}${remembered.country ? ', ' + remembered.country : ''}`;
} else {
  loadPlace({ name: 'Vienna', country: 'Austria', lat: 48.2082, lon: 16.3738 });
  searchInput.value = 'Vienna, Austria';
}
</script>
