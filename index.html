      const value = idx === undefined ? null : airHourly.aerosol_optical_depth[idx];
      if (!Number.isFinite(value)) continue;
      const attrs = `x="${(xFor(i) - cellW / 2).toFixed(1)}" y="${hazeTop}" width="${cellW.toFixed(1)}" height="${rowH}" rx="2"`;
      const fill = value < 0.15 ? 'var(--grid-line)' : '#8ea0b8';
      const opacity = value < 0.15 ? '0.35' : aodOpacity(value).toFixed(2);
      const label = value < 0.15 ? 'clear' : value < 0.5 ? 'some haze' : 'hazy';
      cells.push(`<rect data-role="haze-cell" ${attrs} fill="${fill}" opacity="${opacity}"><title>${hourTooltipLabel(times[i], n)}: aerosol optical depth ${value.toFixed(2)} (${label})</title></rect>`);
    }
  }
  for (let i = 0; i < n; i++) {
    const reporting = base
      .map(m => ({ name: m.name, v: m.sun ? m.sun[i] : null }))
      .filter(d => d.v !== null && d.v !== undefined);
    if (!reporting.length) continue; // no model reported this hour → gap
    const meanSecs = reporting.reduce((a, d) => a + d.v, 0) / reporting.length;
    const frac = Math.max(0, Math.min(1, meanSecs / 3600));
    const mins = Math.round(meanSecs / 60);
    const hourLabel = times[i] ? hourTooltipLabel(times[i], n) : '';
    const breakdown = reporting.map(d => `${d.name} ${Math.round(d.v / 60)} min`).join(' · ');
    const title = `${hourLabel}: ${mins ? `≈${mins} min sunshine` : 'no sunshine forecast'} (avg of ${reporting.length} model${reporting.length === 1 ? '' : 's'}) — ${breakdown}`;
    const attrs = `data-role="sunshine-cell" x="${(xFor(i) - cellW / 2).toFixed(1)}" y="${sunTop}" width="${cellW.toFixed(1)}" height="${rowH}" rx="2"`;
    if (frac > 0) {
      // Floor mirrors the confidence dots' scale; a full hour of sun is solid.
      const opacity = 0.15 + 0.85 * frac;
      cells.push(`<rect ${attrs} fill="var(--c-sun)" opacity="${opacity.toFixed(2)}"><title>${title}</title></rect>`);
    } else {
      cells.push(`<rect ${attrs} fill="var(--grid-line)" opacity="0.35"><title>${title}</title></rect>`);
    }
  }

  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block;touch-action:manipulation;">
    ${axis.vLines}
    ${cells.join('')}
    ${axis.dayLines}
    ${axis.hourLabels}
    ${axis.dayLabels}
  </svg>`;
}

// ── Wind ──────────────────────────────────────────────────────────
// The same grey model curves + coloured average as temperature, with
// a wind-direction band below the shared 220px plot geometry.

// Height of the direction band between the plot's baseline and the
// hour labels — the same reserved-strip pattern as the precipitation
// chart's confidence dots (CONFIDENCE_DOT_ROW), so the band adds
// annotation space below the plot without shrinking the plot area the
// height parity with the temperature chart is about.
const DIR_ROW = 18;

// Circular mean of directions in degrees (0–360). A plain arithmetic mean
// is wrong twice over for angles: 350° and 10° average to 180° — the exact
// opposite of the true answer, north — and the wrap at 360/0 breaks the
// averaging outright. Summing unit vectors and taking atan2 of the
// resultant has neither problem.
function circMeanDeg(vals) {
  let s = 0, c = 0;
  for (const v of vals) {
    const r = v * Math.PI / 180;
    s += Math.sin(r); c += Math.cos(r);
  }
  return (Math.atan2(s, c) * 180 / Math.PI + 360) % 360;
}

// Shortest angular distance between two directions, 0–180. The mean of
// these across models is the direction spread the arrows' fade encodes.
function angDistDeg(a, b) {
  const d = Math.abs(a - b) % 360;
  return d > 180 ? 360 - d : d;
}

const COMPASS16 = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const degToCompass = deg => COMPASS16[Math.round((((deg % 360) + 360) % 360) / 22.5) % 16];

// Hours whose (filtered-set) average sustained speed falls below this are
// "calm" for the direction band's purposes — a direction is meaningless
// at ~zero wind, so those hours draw a small neutral dot instead of an
// arrow pointing wherever the models' noise happens to sum.
const CALM_KMH = 2;

function buildWindChart(avail, width, selected) {
  const n = avail[0].times.length;
  const isMultiDay = n > 24;
  const W = width || 1000;
  const H = 220 + DIR_ROW + (isMultiDay ? 14 : 0);
  const PAD_L = CHART_PAD_L, PAD_R = CHART_PAD_R, PAD_T = 16, PAD_B = (isMultiDay ? 40 : 26) + DIR_ROW;
  const plotW = W - PAD_L - PAD_R;
  const plotH = H - PAD_T - PAD_B;

  // Scale from every model's values, not just the filtered set, so the
  // y-axis doesn't jump when a filter is toggled — same choice as the
  // temperature chart. Floored at 30 km/h so a near-calm day doesn't
  // exaggerate small differences.
  let top = 0;
  avail.forEach(m => m.winds.forEach(v => { if (v !== null && v !== undefined && v > top) top = v; }));
  const vMax = Math.max(30, Math.ceil(top));

  const xFor = chartXFor(PAD_L, plotW, n);
  const yFor = v => PAD_T + plotH - (Math.max(0, v) / vMax) * plotH;
  const plotBottom = PAD_T + plotH;

  const times = avail[0].times;
  const axis = buildXAxis(times, n, plotW, plotH, PAD_L, PAD_T, DIR_ROW);

  const steps = 4;
  const gridLines = [];
  for (let s = 0; s <= steps; s++) {
    const val = vMax * s / steps;
    const y = yFor(val);
    gridLines.push(`<line x1="${PAD_L}" y1="${y.toFixed(1)}" x2="${W - PAD_R}" y2="${y.toFixed(1)}" stroke="var(--grid-line)" stroke-width="1"/>
      <text x="${W - PAD_R + 8}" y="${(y + 3).toFixed(1)}" font-size="10" fill="var(--ink)" font-family="IBM Plex Mono">${Math.round(val)}</text>`);
  }

  const lines = forecastCurves(avail, 'winds', times, xFor, yFor, selected, 'var(--c-wind)', ' km/h');

  // Direction band: one arrow per hour in the reserved strip between
  // the plot's baseline and the hour labels. The arrow points where the
  // wind blows toward; the tooltip gives the FROM notation a weather
  // map uses. Opacity is agreement: solid means the models agree on
  // direction, faint means they scatter (same fade-by-agreement idea as
  // the confidence dots). Everything averages the filtered set — speed
  // and direction are averages, not counts — and hours no model
  // reported on are left as genuine gaps.
  const base = selected ? avail.filter(m => selected.has(m.id)) : avail;
  const colW = plotW / n;
  const s = Math.max(2.5, Math.min(6, colW / 2 - 0.5, DIR_ROW / 2 - 2.5));
  const cy = plotBottom + DIR_ROW / 2;
  const dirArrows = [];
  for (let i = 0; i < n; i++) {
    const speeds = base.map(m => m.winds[i]).filter(v => v !== null && v !== undefined);
    if (!speeds.length) continue; // no model reported this hour → gap
    const avg = speeds.reduce((a, b) => a + b, 0) / speeds.length;
    const x = xFor(i);
    const hourLabel = times[i] ? hourTooltipLabel(times[i], n) : '';
    if (avg < CALM_KMH) {
      const title = `${hourLabel}: calm (under ${CALM_KMH} km/h)`;
      dirArrows.push(`<circle cx="${x.toFixed(1)}" cy="${cy.toFixed(1)}" r="${Math.max(1, s * 0.4).toFixed(1)}" fill="var(--ink)" opacity="0.55"><title>${title}</title></circle>`);
      continue;
    }
    const reporting = base
      .map(m => ({ name: m.name, dir: m.wdir ? m.wdir[i] : null }))
      .filter(d => d.dir !== null && d.dir !== undefined);
    if (!reporting.length) continue; // speeds but no direction from anyone
    const mean = circMeanDeg(reporting.map(d => d.dir));
    const spread = reporting.reduce((a, d) => a + angDistDeg(d.dir, mean), 0) / reporting.length;
    const opacity = (0.45 + 0.55 * Math.max(0, 1 - spread / 90)).toFixed(2);
    const toward = (mean + 180) % 360;
    const breakdown = reporting.map(d => `${d.name} ${degToCompass(d.dir)}`).join(' · ');
    const title = `${hourLabel}: ${Math.round(avg)} km/h from ${degToCompass(mean)} (${Math.round(mean)}°), spread ${Math.round(spread)}° across ${reporting.length} model${reporting.length === 1 ? '' : 's'} — ${breakdown}`;
    dirArrows.push(`<path d="M0,${(-s).toFixed(1)} L${(s * 0.62).toFixed(1)},${(s * 0.78).toFixed(1)} L0,${(s * 0.34).toFixed(1)} L${(-s * 0.62).toFixed(1)},${(s * 0.78).toFixed(1)} Z" fill="var(--ink)" opacity="${opacity}" transform="translate(${x.toFixed(1)},${cy.toFixed(1)}) rotate(${toward.toFixed(1)})"><title>${title}</title></path>`);
  }

  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block;touch-action:manipulation;">
    ${axis.vLines}
    ${gridLines.join('')}
    ${lines}
    ${dirArrows.join('')}
    ${axis.dayLines}
    ${axis.hourLabels}
    ${axis.dayLabels}
  </svg>`;
}

// ── Haze ───────────────────────────────────────────────────────────────
// Haze (aerosol optical depth) is dimensionless and roughly 0-1+; clear
// sky ≈ 0.0-0.1, heavy haze/dust > 0.5. A linear scale would leave most
// hours nearly invisible, so opacity follows the square root.
function aodOpacity(v) {
  return 0.10 + 0.90 * Math.sqrt(Math.max(0, Math.min(1, v)));
}

// Scale key lives in the sunshine section's info tooltip, not another panel.
function buildHazeLegend() {
  return `<div class="haze-legend">${[0, 0.25, 0.5, 0.75, 1].map(value =>
    `<span class="haze-legend-item"><span class="haze-legend-sw" style="background:${value < 0.15 ? 'var(--grid-line)' : '#8ea0b8'};opacity:${value < 0.15 ? '0.35' : aodOpacity(value).toFixed(2)}"></span>${value.toFixed(2)}</span>`
  ).join('')}</div>`;
}

// load a remembered place if one was saved, otherwise default to Vienna, Austria
const remembered = loadRememberedPlace();
if (remembered) {
  rememberCheckbox.checked = true;
  loadPlace(remembered);
} else {
  loadPlace({ name: 'Vienna', country: 'Austria', lat: 48.2082, lon: 16.3738 });
}
</script>
</body>
</html>
