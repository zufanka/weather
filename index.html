<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rainfrog — multi-model weather</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0e141b;
    --bg-panel: #131b24;
    --bg-card: #161f29;
    --grid-line: #223140;
    --ink: #e9e4d6;
    --ink-dim: #8fa0ab;
    --ink-faint: #56656f;
    --accent: #d7cdb0;
    --c-precip: #6ea3d1;
    --c-confidence: #d68fae;
    --c-icon: #d65d4a;
    --c-ecmwf: #4f8fdb;
    --c-gfs: #4fb37a;
    --c-gem: #e0c23d;
    --c-ukmo: #a884d6;
    --c-meteofrance: #29b6d8;
    --risk-storm: #e35b5b;
    --risk-rain: #4f8fdb;
    --risk-snow: #7fd9e6;
    --risk-wind: #b489dd;
    --risk-none: #223140;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top left, #16202b 0%, var(--bg) 55%);
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px;}

  /* header */
  header{margin-bottom:22px;}
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(26px,5vw,38px);
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  h1 span{color:var(--c-ecmwf);}
  .sub{color:var(--ink-dim);font-size:13px;margin-bottom:18px;}

  /* search */
  .search-box{position:relative;max-width:420px;}
  .search-box input{
    width:100%;
    background:var(--bg-panel);
    border:1px solid var(--grid-line);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    padding:11px 14px;
    border-radius:3px;
    outline:none;
  }
  .search-box input:focus{border-color:var(--c-ecmwf);}
  .search-box input::placeholder{color:var(--ink-faint);}
  .results{
    position:absolute;top:calc(100% + 4px);left:0;right:0;
    background:var(--bg-panel);
    border:1px solid var(--grid-line);
    border-radius:3px;
    overflow:hidden;
    z-index:20;
    display:none;
  }
  .results.show{display:block;}
  .result-item{
    padding:13px 14px;
    cursor:pointer;
    font-size:13px;
    border-bottom:1px solid var(--grid-line);
    display:flex;justify-content:space-between;gap:10px;
  }
  .result-item:last-child{border-bottom:none;}
  .result-item:hover{background:#1c2733;}
  .result-item .rname{color:var(--ink);}
  .result-item .rmeta{color:var(--ink-dim);font-size:11px;white-space:nowrap;}

  .remember-toggle{
    display:flex;align-items:center;gap:7px;
    font-size:12px;color:var(--ink-dim);
    margin-top:10px;cursor:pointer;user-select:none;
  }
  .remember-toggle input{accent-color:var(--c-ecmwf);width:14px;height:14px;cursor:pointer;}
  .status{color:var(--ink-dim);font-size:12px;margin-top:10px;min-height:16px;}
  .status-error{color:#e8a48c;}

  /* hero spread */
  .hero{
    margin-top:26px;
    background:var(--bg-panel);
    border:1px solid var(--grid-line);
    border-radius:4px;
    padding:20px 22px 22px;
  }
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .hero-label{
    font-family:'Space Grotesk',sans-serif;font-weight:600;
    font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);
  }
  .day-switch{
    display:inline-flex;background:#1a232d;border:1px solid var(--grid-line);
    border-radius:20px;padding:3px;gap:2px;margin-top:10px;
  }
  .day-switch-btn{
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;
    color:var(--ink-dim);background:transparent;border:none;
    border-radius:16px;padding:9px 16px;cursor:pointer;
  }
  .day-switch-btn:hover:not(.active){color:var(--ink);}
  .day-switch-btn.active{background:var(--c-ecmwf);color:#0a121a;}
  .hero-right{text-align:right;}
  .hero-now-val{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:32px;line-height:1;color:var(--ink);}
  .hero-now-range{font-size:11px;color:var(--ink-dim);margin-top:2px;}
  .hero-astro{font-size:11px;color:var(--ink-dim);margin-top:6px;white-space:nowrap;}
  .chart-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:16px;
    color:var(--ink);
    margin:20px 0 10px;
    display:flex;align-items:center;gap:7px;
  }

  /* (i) info icon that opens a small explanatory tooltip on click/tap —
     click rather than hover so it works the same on mobile and desktop. */
  .info-icon{
    position:relative;
    display:inline-flex;align-items:center;justify-content:center;
    width:16px;height:16px;flex:none;
    border-radius:50%;border:1px solid var(--ink-faint);background:transparent;
    color:var(--ink-dim);font-family:'Space Grotesk',sans-serif;
    font-size:10px;font-weight:600;line-height:1;cursor:pointer;padding:0;
  }
  .info-icon:hover,.info-icon:focus-visible{border-color:var(--c-ecmwf);color:var(--ink);outline:none;}
  .info-icon .info-tooltip{
    display:none;position:absolute;z-index:30;
    top:calc(100% + 8px);left:50%;transform:translateX(-50%);
    width:min(260px,72vw);
    background:var(--bg-card);border:1px solid var(--grid-line);border-radius:6px;
    padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.4);
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:400;
    line-height:1.5;color:var(--ink-dim);text-align:left;white-space:normal;cursor:auto;
  }
  .info-icon.open .info-tooltip{display:block;}
  .temp-chart-wrap{
    margin:0 0 20px;background:var(--bg-card);border:1px solid var(--grid-line);
    border-radius:6px;padding:14px 12px 4px;
  }
  .chart-caption{font-size:10px;color:var(--ink-dim);margin-top:6px;}
  .chart-caption-lead{font-size:10px;color:var(--ink-dim);margin:0 0 6px;}
  .spread-block{border-bottom:1px solid var(--grid-line);padding-bottom:8px;margin-bottom:12px;}

  .hazard-row{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:18px;}
  .hazard-chip{
    display:flex;align-items:center;gap:7px;
    background:#1a232d;border:1px solid var(--grid-line);
    border-radius:20px;padding:6px 12px 6px 10px;
    font-size:12px;
  }
  .hazard-dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .hazard-high .hazard-dot{background:#e35d4f;box-shadow:0 0 6px #e35d4faa;}
  .hazard-high{border-color:#5c2e2a;background:#291b1a;}
  .hazard-high .hazard-label{color:#f0b3ab;}
  .hazard-low .hazard-dot{background:#e0a13d;}
  .hazard-low .hazard-label{color:#e8d2ab;}
  .hazard-count{color:var(--ink-dim);font-size:10px;}

  .strip{position:relative;height:78px;margin:0 6px 6px;}
  .strip-line{position:absolute;left:0;right:0;top:52px;height:1px;background:var(--grid-line);}
  .strip-band{position:absolute;top:48px;height:9px;background:linear-gradient(90deg, rgba(215,205,176,.06), rgba(215,205,176,.16), rgba(215,205,176,.06));border-radius:5px;}
  .strip-dot{position:absolute;top:45px;width:15px;height:15px;border-radius:50%;border:2px solid var(--bg-panel);transform:translateX(-50%);}
  .strip-val{position:absolute;top:0;font-size:11px;font-weight:600;transform:translateX(-50%);white-space:nowrap;}
  .strip-axis{position:absolute;top:62px;font-size:10px;color:var(--ink);transform:translateX(-50%);}

  .legend{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 22px;}
  .legend-item{
    display:flex;align-items:center;gap:6px;margin:0;
    font-family:inherit;font-size:11px;color:var(--ink-dim);
    background:transparent;border:1px solid transparent;border-radius:20px;
    padding:5px 11px 5px 9px;cursor:pointer;
    transition:opacity .15s,border-color .15s,background .15s,color .15s;
  }
  .legend-item:hover:not(:disabled){border-color:var(--grid-line);color:var(--ink);}
  .legend-item:focus-visible{outline:2px solid var(--c-ecmwf);outline-offset:2px;}
  /* Selected: filled pill in the model's own color (via the --mc custom
     property each item carries) plus a checkmark, so the state reads even
     to someone who can't distinguish the dot colors. Dimmed: present but
     not part of the filter — same color, faded. Unavailable is a separate,
     always-gray look (see .legend-item.is-unavailable below) so "no data
     here" is never mistaken for "not selected". */
  .legend-item.is-selected{background:#1a232d;border-color:var(--mc);color:var(--ink);}
  .legend-item.is-dimmed{opacity:.4;}
  .legend-item.is-unavailable{opacity:.35;cursor:default;}
  .legend-dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .legend-check{font-size:10px;color:var(--mc);}

  .no-data{font-size:11px;color:var(--ink-faint);padding:20px 0;text-align:center;}

  footer{margin-top:36px;font-size:11px;color:var(--ink-dim);line-height:1.6;}
  footer a{color:var(--ink-dim);}

  @media (max-width:640px){
    .wrap{padding:16px 12px 40px;}
    .hero{padding:16px 14px 18px;}
    .hero-top{flex-direction:column;align-items:flex-start;gap:12px;}
    .hero-right{text-align:left;width:100%;}
    .hero-astro{white-space:normal;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>rain<span>frog</span></h1>
    <div class="sub">Six national weather models, compared.</div>
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="Search a place… (e.g. Innsbruck)" autocomplete="off">
      <div class="results" id="results"></div>
    </div>
    <label class="remember-toggle">
      <input type="checkbox" id="rememberCheckbox">
      Remember this location
    </label>
    <div class="status" id="status"></div>
  </header>

  <div id="app"></div>

  <footer>
    Data: <a href="https://open-meteo.com" target="_blank">Open-Meteo.com</a>, CC BY 4.0 — ICON (DWD, Germany) · IFS (ECMWF) · GFS (NOAA) · GEM (ECCC, Canada) · UKMO (UK Met Office) · ARPEGE/AROME (Météo-France). Model availability and resolution vary by region; not all six always cover every location.
  </footer>
</div>

<script>
const MODELS = [
  { id:'icon_seamless',        name:'ICON',   agency:'DWD · Germany',        res:'~11 km · to 7d',  color:'var(--c-icon)' },
  { id:'ecmwf_ifs025',         name:'IFS',    agency:'ECMWF · Europe',       res:'9–25 km · to 15d', color:'var(--c-ecmwf)' },
  { id:'gfs_seamless',         name:'GFS',    agency:'NOAA · United States', res:'~11 km · to 16d', color:'var(--c-gfs)' },
  { id:'gem_seamless',         name:'GEM',    agency:'ECCC · Canada',        res:'~15 km · to 10d', color:'var(--c-gem)' },
  { id:'ukmo_seamless',        name:'UKMO',   agency:'Met Office · UK',      res:'~10 km · to 7d',  color:'var(--c-ukmo)' },
  { id:'meteofrance_seamless', name:'ARPEGE', agency:'Météo-France',         res:'~25 km · to 4d',  color:'var(--c-meteofrance)' },
];

// Shared horizontal geometry so the hourly x-axis lines up exactly between
// the temperature chart and the precipitation chart below it. Both charts
// size themselves to however many hours the active view covers (24 or 72),
// read straight off the data rather than a fixed constant.
const CHART_PAD_L = 14;
const CHART_PAD_R = 36;
const chartXFor = (padL, plotW, n) => i => padL + (i + 0.5) * (plotW / n);

// Pick the widest hour-label interval (from a set of clean divisors) that
// still keeps every label at least minSpacing px apart — so labels never
// crowd together on narrow screens, and both charts use the same interval
// so their gridlines/labels stay aligned. `candidates` lets a multi-day
// chart cap how coarse the step is allowed to get (see HOUR_TICK_CANDIDATES).
const CHART_LABEL_MIN_SPACING = 46;
function pickHourStep(plotW, hours, minSpacing, candidates) {
  const maxLabels = Math.max(2, Math.floor(plotW / (minSpacing || CHART_LABEL_MIN_SPACING)));
  const list = candidates || [1, 2, 3, 4, 6, 8, 12, 24, 48, 72];
  for (const step of list) {
    if (Math.ceil(hours / step) <= maxLabels) return step;
  }
  return list[list.length - 1];
}

// Divisors of 24 that top out at 8h — i.e. never fewer than 3 gridlines per
// calendar day, however little width is available. Used only once the chart
// spans more than a day, when a separate day axis (see buildXAxis) already
// carries the date, so the hour ticks stay short ("06") and can afford to
// sit close together on a phone screen.
const HOUR_TICK_CANDIDATES = [1, 2, 3, 4, 6, 8];
const DAY_AXIS_LABEL_SPACING = 24;

const WEEKDAY_ABBR = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

function hourAxisLabel(t, spanHours) {
  const timePart = t.split('T')[1];
  return spanHours > 24 ? timePart.slice(0, 2) : timePart.slice(0, 5);
}

// For tooltips, which have room for the full "HH:MM" rather than the axis's
// truncated "06", plus the weekday since a repeating 00:00 across several
// days would otherwise be ambiguous. Parsed as UTC-midnight-of-that-date so
// the weekday can't drift with the browser's own timezone.
function hourTooltipLabel(t, spanHours) {
  const [datePart, timePart] = t.split('T');
  const hm = timePart.slice(0, 5);
  if (spanHours <= 24) return hm;
  const weekday = WEEKDAY_ABBR[new Date(datePart + 'T00:00:00Z').getUTCDay()];
  return `${weekday} ${hm}`;
}

// The x-axis shared by the temperature and precipitation charts: hour
// gridlines/labels, plus — once the view spans more than a day — a coarser
// day axis underneath it (a stronger boundary line where the date rolls
// over, and a weekday label centered under each day's segment), so days
// don't have to be squeezed into the hour labels themselves. `topOffset`
// pushes every label row down by that many px, for a chart that needs to
// reserve a strip just below the plot for something else first (the
// precipitation chart's confidence dots).
function buildXAxis(times, n, plotW, plotH, PAD_L, PAD_T, topOffset) {
  const xFor = chartXFor(PAD_L, plotW, n);
  const isMultiDay = n > 24;
  const hourStep = isMultiDay
    ? pickHourStep(plotW, n, DAY_AXIS_LABEL_SPACING, HOUR_TICK_CANDIDATES)
    : pickHourStep(plotW, n);
  const off = topOffset || 0;

  const vLines = [];
  const hourLabels = [];
  const hourLabelY = PAD_T + plotH + off + (isMultiDay ? 14 : 20);
  for (let i = 0; i < n; i += hourStep) {
    const t = times[i];
    if (!t) continue;
    const x = xFor(i);
    vLines.push(`<line x1="${x.toFixed(1)}" y1="${PAD_T}" x2="${x.toFixed(1)}" y2="${(PAD_T + plotH).toFixed(1)}" stroke="var(--grid-line)" stroke-width="1" opacity="0.5"/>`);
    hourLabels.push(`<text x="${x.toFixed(1)}" y="${hourLabelY.toFixed(1)}" font-size="10" fill="var(--ink)" text-anchor="middle" font-family="IBM Plex Mono">${hourAxisLabel(t, n)}</text>`);
  }

  let dayLines = '', dayLabels = '';
  if (isMultiDay) {
    // Split the hours into per-calendar-day segments so each one gets its
    // own boundary line and a label centered under its own span.
    const segments = [];
    let segStart = 0, segDate = times[0] ? times[0].split('T')[0] : null;
    for (let i = 1; i < n; i++) {
      if (!times[i]) continue;
      const d = times[i].split('T')[0];
      if (d !== segDate) {
        segments.push({ start: segStart, end: i - 1, date: segDate });
        segStart = i;
        segDate = d;
      }
    }
    segments.push({ start: segStart, end: n - 1, date: segDate });

    const colW = plotW / n;
    const dayLineParts = [];
    const dayLabelParts = [];
    const dayLabelY = PAD_T + plotH + off + 30;
    segments.forEach((seg, si) => {
      if (si > 0) {
        const x = xFor(seg.start) - colW / 2; // sits between the two straddling hours
        dayLineParts.push(`<line x1="${x.toFixed(1)}" y1="${PAD_T}" x2="${x.toFixed(1)}" y2="${(PAD_T + plotH).toFixed(1)}" stroke="var(--grid-line)" stroke-width="1" opacity="0.9"/>`);
      }
      const x = xFor((seg.start + seg.end) / 2);
      const label = si === 0 ? 'Today' : WEEKDAY_ABBR[new Date(seg.date + 'T00:00:00Z').getUTCDay()];
      dayLabelParts.push(`<text x="${x.toFixed(1)}" y="${dayLabelY.toFixed(1)}" font-size="10" fill="var(--ink)" text-anchor="middle" font-family="IBM Plex Mono" letter-spacing="0.03em">${label}</text>`);
    });
    dayLines = dayLineParts.join('');
    dayLabels = dayLabelParts.join('');
  }

  return { vLines: vLines.join(''), hourLabels: hourLabels.join(''), dayLines, dayLabels };
}

const $ = sel => document.querySelector(sel);
const searchInput = $('#searchInput');
const resultsBox = $('#results');
const statusBox = $('#status');
const app = $('#app');
const rememberCheckbox = $('#rememberCheckbox');

let debounceTimer = null;
let currentPlace = null;
let lastAvailModels = null;

// Hours of forecast shown from right now: 24 = "24h", 72 = the rolling
// 3-day overview. Re-render on switch reuses the already-fetched response —
// no re-fetch needed.
let activeRange = 24;
let lastPlace = null;
let lastEntries = null;
let lastAstro = null;

// Model ids the user has clicked on in the legend, surviving re-renders the
// same way activeRange does (render() rebuilds the DOM from scratch, so the
// state has to live outside it). Empty = no filter, show everything at full
// strength — filtering is opt-in.
let selectedModels = new Set();

// The chosen ids aren't necessarily present at the currently-searched place
// (a model can be selected, then the user searches somewhere it doesn't
// cover). This resolves the raw selection against `avail` (models that
// actually returned data) into the Set every chart should treat as "the
// filter" — or null if that intersection is empty, meaning either nothing
// is selected or everything selected is unavailable here. Either way, null
// means render at full strength rather than a filter that matches nothing.
function effectiveSelection(avail) {
  if (!selectedModels.size) return null;
  const ids = avail.filter(m => selectedModels.has(m.id)).map(m => m.id);
  return ids.length ? new Set(ids) : null;
}

// Charts are drawn at the exact measured pixel width of their container
// (see renderResponsiveCharts), so 1 SVG unit = 1 CSS pixel and text is
// always true-size — never shrunk to illegibility, never needs to scroll.
// Redraw them on resize/orientation-change so they stay that way.
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderResponsiveCharts, 150);
});

const REMEMBER_KEY = 'rainfrog.modelSpread.place';
function saveRememberedPlace(place) {
  try { localStorage.setItem(REMEMBER_KEY, JSON.stringify(place)); } catch (e) {}
}
function clearRememberedPlace() {
  try { localStorage.removeItem(REMEMBER_KEY); } catch (e) {}
}
function loadRememberedPlace() {
  try {
    const raw = localStorage.getItem(REMEMBER_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

rememberCheckbox.addEventListener('change', () => {
  if (rememberCheckbox.checked) {
    if (currentPlace) saveRememberedPlace(currentPlace);
  } else {
    clearRememberedPlace();
  }
});

// Delegated on #app (not the buttons themselves) since render() rebuilds
// the whole hero — including these buttons — on every place load, tab
// switch, and model-filter click alike.
app.addEventListener('click', (e) => {
  if (!lastEntries) return;

  // (i) tooltips: toggle the clicked one, close any other that was open —
  // pure DOM class toggling, no re-render, so it doesn't disturb chart/
  // filter state or cause a flash.
  const infoBtn = e.target.closest('.info-icon');
  if (infoBtn) {
    const wasOpen = infoBtn.classList.contains('open');
    document.querySelectorAll('.info-icon.open').forEach(el => {
      el.classList.remove('open');
      el.setAttribute('aria-expanded', 'false');
    });
    if (!wasOpen) {
      infoBtn.classList.add('open');
      infoBtn.setAttribute('aria-expanded', 'true');
    }
    return;
  }

  const dayBtn = e.target.closest('.day-switch-btn');
  if (dayBtn) {
    const hours = Number(dayBtn.dataset.hours);
    if (hours === activeRange) return;
    activeRange = hours;
    render(lastPlace, lastEntries, lastAstro);
    return;
  }

  const legendBtn = e.target.closest('.legend-item');
  if (legendBtn && !legendBtn.disabled) {
    const id = legendBtn.dataset.model;
    if (selectedModels.has(id)) selectedModels.delete(id); else selectedModels.add(id);
    render(lastPlace, lastEntries, lastAstro);
  }
});

searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  const q = searchInput.value.trim();
  if (q.length < 2) { resultsBox.classList.remove('show'); return; }
  debounceTimer = setTimeout(() => runGeocode(q), 300);
});

document.addEventListener('click', (e) => {
  if (!resultsBox.contains(e.target) && e.target !== searchInput) {
    resultsBox.classList.remove('show');
  }
  if (!e.target.closest('.info-icon')) {
    document.querySelectorAll('.info-icon.open').forEach(el => {
      el.classList.remove('open');
      el.setAttribute('aria-expanded', 'false');
    });
  }
});

async function runGeocode(q) {
  try {
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=en&format=json`;
    const res = await fetch(url);
    const data = await res.json();
    renderResults(data.results || []);
  } catch (e) {
    resultsBox.innerHTML = '<div class="result-item"><span class="rname">Search failed — try again</span></div>';
    resultsBox.classList.add('show');
  }
}

function renderResults(list) {
  if (!list.length) {
    resultsBox.innerHTML = '<div class="result-item"><span class="rname">No places found</span></div>';
    resultsBox.classList.add('show');
    return;
  }
  resultsBox.innerHTML = list.map((r, i) => {
    const region = [r.admin1, r.country].filter(Boolean).join(', ');
    return `<div class="result-item" data-i="${i}">
      <span class="rname">${escapeHtml(r.name)}</span>
      <span class="rmeta">${escapeHtml(region)}</span>
    </div>`;
  }).join('');
  resultsBox.classList.add('show');
  resultsBox.querySelectorAll('.result-item').forEach(el => {
    el.addEventListener('click', () => {
      const r = list[+el.dataset.i];
      if (!r.latitude) return;
      searchInput.value = `${r.name}, ${r.country || ''}`;
      resultsBox.classList.remove('show');
      loadPlace({ name: r.name, country: r.country, lat: r.latitude, lon: r.longitude });
    });
  });
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// A section headline with a click-to-open (i) tooltip explaining what the
// section shows. Click rather than hover so it's equally usable on a phone.
function sectionHead(title, info) {
  return `<div class="chart-title">${escapeHtml(title)}
    <button type="button" class="info-icon" aria-label="About ${escapeHtml(title)}" aria-haspopup="true" aria-expanded="false">i
      <span class="info-tooltip" role="tooltip">${escapeHtml(info)}</span>
    </button>
  </div>`;
}

async function fetchModel(place, model) {
  // forecast_days=4 guarantees a full 72h window is available no matter what
  // hour "now" falls on within day 0 (worst case: now = day 0, hour 23).
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}&hourly=temperature_2m,precipitation,precipitation_probability,weather_code,wind_speed_10m,wind_gusts_10m&models=${model.id}&forecast_days=4&timezone=auto`;
  const res = await fetch(url);
  const body = await res.json().catch(() => null);
  if (!res.ok || !body || body.error) {
    const reason = (body && body.reason) ? body.reason : `HTTP ${res.status}`;
    throw new Error(reason);
  }
  return body;
}

async function fetchAstro(place) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}&daily=sunrise,sunset,moon_phase&forecast_days=2&timezone=auto`;
  const res = await fetch(url);
  const body = await res.json().catch(() => null);
  if (!res.ok || !body || body.error || !body.daily) return null;
  return body.daily;
}

async function loadPlace(place) {
  currentPlace = place;
  if (rememberCheckbox.checked) saveRememberedPlace(place);

  statusBox.textContent = `Fetching model runs for ${place.name}…`;
  app.innerHTML = '';

  const [settled, astro] = await Promise.all([
    Promise.allSettled(MODELS.map(m => fetchModel(place, m))),
    fetchAstro(place).catch(() => null),
  ]);

  const ok = settled.filter(s => s.status === 'fulfilled');
  if (!ok.length) {
    const firstError = settled.find(s => s.status === 'rejected');
    const reason = firstError ? firstError.reason.message : 'unknown error';
    statusBox.innerHTML = `<span class="status-error">Could not reach Open-Meteo (${escapeHtml(reason)}). This can happen if your network blocks outside API calls. Try again, or try another place.</span>`;
    return;
  }

  render(place, MODELS.map((m, i) => ({
    model: m,
    result: settled[i].status === 'fulfilled' ? settled[i].value : null,
    error: settled[i].status === 'rejected' ? settled[i].reason.message : null,
  })), astro);

  const failedCount = settled.length - ok.length;
  statusBox.textContent = failedCount ? `${failedCount} of ${MODELS.length} models unavailable for this location.` : '';
}

// Index of the current hour in the model's local time series — both the
// 24h and 72h views start right now, they just cover different spans from
// that point.
function findStartIndex(times, utcOffsetSeconds) {
  const nowLocal = new Date(Date.now() + utcOffsetSeconds * 1000);
  const y = nowLocal.getUTCFullYear();
  const mo = String(nowLocal.getUTCMonth() + 1).padStart(2, '0');
  const d = String(nowLocal.getUTCDate()).padStart(2, '0');
  const h = String(nowLocal.getUTCHours()).padStart(2, '0');
  const targetStr = `${y}-${mo}-${d}T${h}:00`;
  let idx = times.indexOf(targetStr);
  if (idx === -1) idx = times.findIndex(t => t >= targetStr);
  return idx === -1 ? 0 : idx;
}

function extractSeries(hourly, modelId, variable) {
  // find the key that matches variable_modelId, tolerant of naming variations
  const exact = `${variable}_${modelId}`;
  if (hourly[exact]) return hourly[exact];
  if (hourly[variable]) return hourly[variable]; // single-model response comes back unsuffixed
  const fuzzy = Object.keys(hourly).find(k => k.startsWith(variable) && k.endsWith(modelId));
  return fuzzy ? hourly[fuzzy] : null;
}

const THUNDER_CODES = [95, 96, 99];
const HEAVY_SNOW_CODES = [75, 86];
const HEAVY_RAIN_CODES = [65, 67, 82];
const FREEZING_RAIN_CODES = [66, 67];
const HEAVY_RAIN_MM_PER_HR = 4;
const STRONG_GUST_KMH = 60;
const SEVERE_GUST_KMH = 90;

function classifyHour(code, precip, gust) {
  return {
    thunder: THUNDER_CODES.includes(code),
    heavySnow: HEAVY_SNOW_CODES.includes(code),
    heavyRain: HEAVY_RAIN_CODES.includes(code) || (precip || 0) >= HEAVY_RAIN_MM_PER_HR,
    freezingRain: FREEZING_RAIN_CODES.includes(code),
    strongWind: (gust || 0) >= STRONG_GUST_KMH,
    severeWind: (gust || 0) >= SEVERE_GUST_KMH,
  };
}

function moonPhaseInfo(fraction) {
  if (fraction === null || fraction === undefined) return null;
  const f = ((fraction % 1) + 1) % 1;
  if (f < 0.03 || f >= 0.97) return { name: 'New Moon', emoji: '🌑' };
  if (f < 0.22) return { name: 'Waxing Crescent', emoji: '🌒' };
  if (f < 0.28) return { name: 'First Quarter', emoji: '🌓' };
  if (f < 0.47) return { name: 'Waxing Gibbous', emoji: '🌔' };
  if (f < 0.53) return { name: 'Full Moon', emoji: '🌕' };
  if (f < 0.72) return { name: 'Waning Gibbous', emoji: '🌖' };
  if (f < 0.78) return { name: 'Last Quarter', emoji: '🌗' };
  return { name: 'Waning Crescent', emoji: '🌘' };
}

// Always today's sunrise/sunset/moon — it's context for "right now", not a
// per-view forecast, so it doesn't change between the 24h and 72h views.
function buildAstroLine(astro) {
  if (!astro || !astro.sunrise || !astro.sunrise[0]) return '';
  const sunrise = astro.sunrise[0].split('T')[1];
  const sunset = astro.sunset ? astro.sunset[0].split('T')[1] : null;
  const moon = astro.moon_phase ? moonPhaseInfo(astro.moon_phase[0]) : null;
  const parts = [`🌅 ${sunrise}`];
  if (sunset) parts.push(`🌇 ${sunset}`);
  if (moon) parts.push(`${moon.emoji} ${moon.name}`);
  return `<div class="hero-astro">${parts.join(' · ')}</div>`;
}

function render(place, entries, astro) {
  lastPlace = place;
  lastEntries = entries;
  lastAstro = astro;

  const span = activeRange;

  const perModel = entries.map(({ model: m, result, error }) => {
    if (!result) return { ...m, available: false, error };
    const hourly = result.hourly;
    const times = hourly.time;
    const offset = result.utc_offset_seconds || 0;
    const nowIdx = findStartIndex(times, offset);

    const temps = extractSeries(hourly, m.id, 'temperature_2m');
    const precs = extractSeries(hourly, m.id, 'precipitation');
    const precipProbs = extractSeries(hourly, m.id, 'precipitation_probability');
    const codes = extractSeries(hourly, m.id, 'weather_code');
    const winds = extractSeries(hourly, m.id, 'wind_speed_10m');
    const gusts = extractSeries(hourly, m.id, 'wind_gusts_10m');
    if (!temps) return { ...m, available: false, error: 'no data returned' };

    const t = temps.slice(nowIdx, nowIdx + span);
    const p = (precs || t.map(() => 0)).slice(nowIdx, nowIdx + span).map(v => v || 0);
    const pp = (precipProbs || t.map(() => null)).slice(nowIdx, nowIdx + span);
    const c = (codes || t.map(() => 0)).slice(nowIdx, nowIdx + span);
    const w = (winds || t.map(() => 0)).slice(nowIdx, nowIdx + span).map(v => v || 0);
    const g = (gusts || t.map(() => 0)).slice(nowIdx, nowIdx + span).map(v => v || 0);
    const timesSpan = times.slice(nowIdx, nowIdx + span);
    const validT = t.filter(v => v !== null && v !== undefined);

    const hourFlags = p.map((v, i) => classifyHour(c[i], v, g[i]));
    const flags = {
      thunder: hourFlags.some(f => f.thunder),
      heavySnow: hourFlags.some(f => f.heavySnow),
      heavyRain: hourFlags.some(f => f.heavyRain),
      freezingRain: hourFlags.some(f => f.freezingRain),
      strongWind: hourFlags.some(f => f.strongWind),
      severeWind: hourFlags.some(f => f.severeWind),
    };

    return {
      ...m,
      available: validT.length > 0,
      temps: t, precs: p, precipProb: pp, codes: c, winds: w, gusts: g, times: timesSpan, hourFlags,
      nowVal: t[0],
      totalPrecip: p.reduce((a, b) => a + b, 0),
      avgWind: w.reduce((a, b) => a + b, 0) / w.length,
      maxGust: Math.max(0, ...g),
      flags,
      anyExtreme: flags.thunder || flags.heavySnow || flags.heavyRain || flags.freezingRain || flags.severeWind,
    };
  });

  const header = `<div class="hero"><div class="hero-top">
      <div>
        <div class="hero-label">${escapeHtml(place.name)}${place.country ? ', ' + escapeHtml(place.country) : ''}</div>
        <div class="day-switch">
          <button type="button" class="day-switch-btn${activeRange === 24 ? ' active' : ''}" data-hours="24">24h</button>
          <button type="button" class="day-switch-btn${activeRange === 72 ? ' active' : ''}" data-hours="72">72h</button>
        </div>
      </div>
      <div class="hero-right">
        <div class="hero-now" id="heroNow"></div>
        ${buildAstroLine(astro)}
      </div>
    </div>
    <div id="heroBody"></div>
  </div>`;

  app.innerHTML = header;
  renderHero(perModel);
}

const HAZARDS = [
  { key: 'thunder',      label: 'Thunderstorms',   flagKey: 'thunder' },
  { key: 'severeWind',   label: 'Severe gusts (90+ km/h)', flagKey: 'severeWind' },
  { key: 'heavyRain',    label: 'Heavy rain',       flagKey: 'heavyRain' },
  { key: 'heavySnow',    label: 'Heavy snow',       flagKey: 'heavySnow' },
  { key: 'freezingRain', label: 'Freezing rain',    flagKey: 'freezingRain' },
  { key: 'strongWind',   label: 'Strong gusts (60+ km/h)', flagKey: 'strongWind' },
];

function renderHero(perModel) {
  const box = $('#heroBody');
  const nowBox = $('#heroNow');
  const avail = perModel.filter(m => m.available);
  if (!avail.length) {
    nowBox.innerHTML = '';
    box.innerHTML = '<div class="no-data">No data available from any model for this location.</div>';
    lastAvailModels = null;
    return;
  }

  const nowTemps = avail.map(m => m.nowVal).filter(v => v !== null && v !== undefined);
  if (nowTemps.length) {
    const nowAvg = nowTemps.reduce((a, b) => a + b, 0) / nowTemps.length;
    const nowMin = Math.min(...nowTemps), nowMax = Math.max(...nowTemps);
    const rangeLabel = nowMax - nowMin >= 1
      ? `${Math.round(nowMin)}–${Math.round(nowMax)}°`
      : '';
    nowBox.innerHTML = `<div class="hero-now-val">${Math.round(nowAvg)}°</div><div class="hero-now-range">${rangeLabel}</div>`;
  } else {
    nowBox.innerHTML = '';
  }

  // Resolve the user's raw legend selection against the models actually
  // available here (see effectiveSelection). Every chart below takes this
  // resolved value, not selectedModels directly.
  const activeSel = effectiveSelection(avail);

  // Hazard chips recompute their counts/denominator against the filtered
  // set rather than dimming individual chips — a hazard only one of your
  // selected models flags would otherwise sit at "1/6", reading as a
  // consensus long-shot when among your selection it might be unanimous.
  // Recomputing means a hazard absent from every selected model just drops
  // off the row instead of lingering grayed-out; the rest of the hero
  // (charts, strip) keeps the "gray, don't hide" approach since those show
  // per-model marks where the full context is worth keeping on screen.
  const hazardBase = activeSel ? avail.filter(m => activeSel.has(m.id)) : avail;

  const hazardRows = HAZARDS.map(h => {
    const hits = hazardBase.filter(m => m.flags[h.flagKey]);
    return { ...h, count: hits.length, models: hits };
  }).filter(h => h.count > 0)
    .sort((a, b) => b.count - a.count);

  const chips = hazardRows.map(h => {
    const level = h.count >= hazardBase.length * 0.5 ? 'high' : 'low';
    return `<div class="hazard-chip hazard-${level}">
      <span class="hazard-dot"></span>
      <span class="hazard-label">${escapeHtml(h.label)}</span>
      <span class="hazard-count">${h.count}/${hazardBase.length}</span>
    </div>`;
  }).join('');

  const precipVals = avail.map(m => m.totalPrecip);
  const pMin = Math.min(...precipVals), pMax = Math.max(...precipVals);

  const lo = 0, hi = Math.max(1, Math.ceil(pMax + 1));
  const range = hi - lo || 1;
  const sorted = [...avail].sort((a, b) => a.totalPrecip - b.totalPrecip);
  const bandLeft = ((pMin - lo) / range) * 100;
  const bandWidth = ((pMax - pMin) / range) * 100;

  const dots = sorted.map((m, i) => {
    const pct = ((m.totalPrecip - lo) / range) * 100;
    const dimmed = activeSel && !activeSel.has(m.id);
    const boosted = activeSel && !dimmed;
    const dotColor = dimmed ? 'var(--ink-faint)' : m.color;
    const dotExtra = dimmed ? 'opacity:.5;' : (boosted ? 'width:18px;height:18px;top:43.5px;z-index:2;' : '');
    const valColor = dimmed ? 'var(--ink-faint)' : m.color;
    const valExtra = dimmed ? 'opacity:.55;' : (boosted ? 'font-weight:700;z-index:2;' : '');
    return `<div class="strip-dot" style="left:${pct}%; background:${dotColor}; ${dotExtra}" title="${m.name}: ${m.totalPrecip.toFixed(1)}mm"></div>
      <div class="strip-val" style="left:${pct}%; top:${(i % 3) * 14}px; color:${valColor}; ${valExtra}">${m.totalPrecip.toFixed(1)}mm</div>`;
  }).join('');

  // Legend doubles as the filter control. Selected/dimmed state is driven
  // by activeSel (so it only lights up for models actually present here);
  // availability is a separate, always-on look (gray dot, disabled, can't
  // be clicked) so "no data for this place" is never confusable with
  // "not part of the filter" — the checkmark still shows for a selected
  // model even when it happens to be unavailable at the current place, so
  // the user can see their pick was remembered.
  const legendItems = perModel.map(m => {
    const rawSelected = selectedModels.has(m.id);
    const classes = ['legend-item'];
    let title;
    if (!m.available) {
      classes.push('is-unavailable');
      title = `${m.name}: no data for this location`;
    } else if (activeSel) {
      if (activeSel.has(m.id)) { classes.push('is-selected'); title = `${m.name}: shown — click to remove from filter`; }
      else { classes.push('is-dimmed'); title = `${m.name}: click to add to filter`; }
    } else {
      title = `${m.name}: click to filter to just this model`;
    }
    return `<button type="button" class="${classes.join(' ')}" data-model="${m.id}" ${!m.available ? 'disabled' : ''} aria-pressed="${rawSelected}" title="${escapeHtml(title)}" style="--mc:${m.color}">
      <span class="legend-dot" style="background:${m.available ? m.color : 'var(--ink-faint)'};"></span>
      ${escapeHtml(m.name)}${rawSelected ? '<span class="legend-check" aria-hidden="true">&check;</span>' : ''}
    </button>`;
  }).join('');

  box.innerHTML = `
    <div class="hazard-row">${chips}</div>
    ${sectionHead('Weather models', "Six national forecast models plotted together. Click a model's name to filter every chart down to just that one (or a few) — the rest stay visible, just grayed out for context.")}
    <div class="legend">
      ${legendItems}
    </div>
    ${sectionHead('Temperature', 'Hourly temperature from each model over the selected time range. Where the lines diverge, the models disagree on how warm or cold it will get.')}
    <div class="temp-chart-wrap" id="tempChartHolder"></div>
    ${sectionHead('Precipitation', 'Top: total rainfall/snow each model expects over the whole view, one dot per model. Bottom: hourly forecast — darker bars mean more models agree on that amount, and the dot under each bar shows the average chance of rain that hour.')}
    <div class="temp-chart-wrap">
      <div class="spread-block">
        <div class="chart-caption-lead">Total across the ${activeRange}h view — one dot per model</div>
        <div class="strip">
          <div class="strip-band" style="left:${bandLeft}%; width:${bandWidth}%;"></div>
          <div class="strip-line"></div>
          ${dots}
          <div class="strip-axis" style="left:0%;">${lo}mm</div>
          <div class="strip-axis" style="left:100%;">${hi}mm</div>
        </div>
      </div>
      <div id="precipChartHolder"></div>
    </div>
  `;

  lastAvailModels = avail;
  renderResponsiveCharts();
}

function renderResponsiveCharts() {
  const avail = lastAvailModels;
  const tempHolder = $('#tempChartHolder');
  const precipHolder = $('#precipChartHolder');
  if (!avail || !tempHolder || !precipHolder) return;
  const width = Math.max(260, Math.round(tempHolder.getBoundingClientRect().width));
  const selected = effectiveSelection(avail);
  tempHolder.innerHTML = buildLineChart(avail, 'temps', { unit: '°', width, selected });
  precipHolder.innerHTML = buildPrecipChart(avail, width, selected);
}

function buildLineChart(avail, seriesKey, opts) {
  const { unit = '', domainMin = null, domainMax = null, height = 220, width = 1000, selected = null } = opts || {};
  const n = avail[0][seriesKey].length;
  const isMultiDay = n > 24;
  // A multi-day chart gets a taller bottom band (day axis under the hour
  // axis) — add that height back rather than shrinking the plot area.
  const W = width, H = height + (isMultiDay ? 14 : 0);
  const PAD_L = CHART_PAD_L, PAD_R = CHART_PAD_R, PAD_T = 16, PAD_B = isMultiDay ? 40 : 26;
  const plotW = W - PAD_L - PAD_R;
  const plotH = H - PAD_T - PAD_B;

  const allVals = [];
  avail.forEach(m => m[seriesKey].forEach(v => { if (v !== null && v !== undefined) allVals.push(v); }));
  if (!allVals.length) allVals.push(domainMin ?? 0, domainMax ?? (domainMin ?? 0) + 1);
  const vMin = domainMin !== null ? domainMin : Math.floor(Math.min(...allVals) - 1);
  const vMax = domainMax !== null ? domainMax : Math.ceil(Math.max(...allVals) + 1);
  const vRange = (vMax - vMin) || 1;

  const xFor = chartXFor(PAD_L, plotW, n);
  const yFor = v => PAD_T + plotH - ((v - vMin) / vRange) * plotH;

  const steps = 4;
  const gridLines = [];
  for (let s = 0; s <= steps; s++) {
    const val = vMin + (vRange * s / steps);
    const y = yFor(val);
    gridLines.push(`<line x1="${PAD_L}" y1="${y.toFixed(1)}" x2="${W - PAD_R}" y2="${y.toFixed(1)}" stroke="var(--grid-line)" stroke-width="1"/>
      <text x="${W - PAD_R + 8}" y="${(y + 3).toFixed(1)}" font-size="10" fill="var(--ink)" font-family="IBM Plex Mono">${Math.round(val)}${unit}</text>`);
  }

  const times = avail[0].times;
  const axis = buildXAxis(times, n, plotW, plotH, PAD_L, PAD_T);

  // With a filter active, draw non-selected lines first (low opacity, thin)
  // so they sit underneath, then the selected ones last (full opacity,
  // thicker) so they paint on top — SVG has no z-index, only paint order.
  const order = selected ? [...avail].sort((a, b) => (selected.has(a.id) ? 1 : 0) - (selected.has(b.id) ? 1 : 0)) : avail;
  const lines = order.map(m => {
    const series = m[seriesKey];
    let path = '';
    series.forEach((v, i) => {
      if (v === null || v === undefined) return;
      const x = xFor(i), y = yFor(v);
      path += (path === '' ? `M${x.toFixed(1)},${y.toFixed(1)}` : ` L${x.toFixed(1)},${y.toFixed(1)}`);
    });
    const isSel = !selected || selected.has(m.id);
    const opacity = selected ? (isSel ? 1 : 0.25) : 0.9;
    const strokeWidth = selected ? (isSel ? 2.5 : 1.5) : 2;
    return `<path d="${path}" fill="none" stroke="${m.color}" stroke-width="${strokeWidth}" opacity="${opacity}"/>`;
  }).join('');

  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block;">
    ${axis.vLines}
    ${gridLines.join('')}
    ${lines}
    ${axis.dayLines}
    ${axis.hourLabels}
    ${axis.dayLabels}
  </svg>`;
}

// One column per hour, but still every model's own bar — which model is
// which still isn't the point, so all of them share one neutral color and a
// low per-bar opacity, overlaid on the same baseline. Same-color transparent
// layers compositing on top of each other is order-independent: the result
// only depends on how many bars overlap at a given height, not which model
// contributed them. So a column where models agree on the amount reads as a
// short, solidly-saturated bar; a column where they're spread out fades from
// solid (near the baseline, where most of them overlap) to faint (near the
// top, where only the highest outlier reaches) — the fade *is* the spread.
// A confidence dot beneath the axis carries the separate question of how
// likely the models think rain is at all, on its own color.
const BAR_LAYER_OPACITY = 0.32;
// Filtered-mode alternative to the above: once a model filter is active,
// "which models agree" stops being the question — "what do my chosen
// models say, against the rest" is. So instead of one neutral color
// layered by count, each bar goes back to being its own model's color
// (the --c-* it already owns elsewhere in the UI), non-selected models
// pushed down to a faint wash and selected ones raised to near-solid, and
// selected bars are drawn last per hour so they paint over the dimmed ones
// they overlap rather than being buried under them.
const BAR_FILTERED_DIMMED_OPACITY = 0.18;
const BAR_FILTERED_SELECTED_OPACITY = 0.85;
const CONFIDENCE_DOT_ROW = 14; // px reserved between the plot and the hour-label row
function buildPrecipChart(avail, width, selected) {
  const n = avail[0].times.length;
  const isMultiDay = n > 24;
  const dotOffset = CONFIDENCE_DOT_ROW;
  const W = width || 1000, H = 220 + dotOffset + (isMultiDay ? 14 : 0);
  const PAD_L = CHART_PAD_L, PAD_R = CHART_PAD_R, PAD_T = 16, PAD_B = (isMultiDay ? 40 : 26) + dotOffset;
  const plotW = W - PAD_L - PAD_R;
  const plotH = H - PAD_T - PAD_B;
  const colW = plotW / n;
  // Gap shrinks with the column itself so barW never exceeds colW — at 72h
  // on a narrow phone, colW can drop below the old fixed 6px floor, which
  // made bars wider than their own column and bleed into neighboring hours.
  const barW = Math.max(1, colW - Math.min(4, colW * 0.25));

  const times = avail[0].times;
  const hours = [];
  for (let i = 0; i < n; i++) {
    // Keep each amount tied to its model (id/color), even in unfiltered
    // mode, so the filtered-mode branch below doesn't need a second pass.
    const amounts = avail.map(m => ({ id: m.id, color: m.color, v: m.precs[i] || 0 })).filter(a => a.v > 0);
    const probs = avail.map(m => m.precipProb[i]).filter(p => p !== null && p !== undefined);
    const avgProb = probs.length ? probs.reduce((a, b) => a + b, 0) / probs.length : null;
    hours.push({ amounts, avgProb, reporting: probs.length, total: avail.length });
  }

  const vMax = Math.max(1, Math.ceil(Math.max(0, ...hours.flatMap(h => h.amounts.map(a => a.v)))));
  const xFor = chartXFor(PAD_L, plotW, n);
  const yFor = v => PAD_T + plotH - (Math.max(0, v) / vMax) * plotH;
  const plotBottom = PAD_T + plotH;

  const steps = 4;
  const gridLines = [];
  for (let s = 0; s <= steps; s++) {
    const val = vMax * s / steps;
    const y = yFor(val);
    gridLines.push(`<line x1="${PAD_L}" y1="${y.toFixed(1)}" x2="${W - PAD_R}" y2="${y.toFixed(1)}" stroke="var(--grid-line)" stroke-width="1"/>
      <text x="${W - PAD_R + 8}" y="${(y + 3).toFixed(1)}" font-size="10" fill="var(--ink)" font-family="IBM Plex Mono">${val.toFixed(val < 2 ? 1 : 0)}mm</text>`);
  }

  const axis = buildXAxis(times, n, plotW, plotH, PAD_L, PAD_T, dotOffset);

  const bars = [];
  const dots = [];
  hours.forEach((h, i) => {
    const x = xFor(i);
    const hourLabel = times[i] ? hourTooltipLabel(times[i], n) : '';

    if (selected) {
      // Selected models drawn last so they paint on top of the dimmed rest
      // at the same x — see the comment above BAR_FILTERED_DIMMED_OPACITY.
      const ordered = [...h.amounts].sort((a, b) => (selected.has(a.id) ? 1 : 0) - (selected.has(b.id) ? 1 : 0));
      ordered.forEach(a => {
        const y = yFor(a.v);
        const barH = plotBottom - y;
        const isSel = selected.has(a.id);
        bars.push(`<rect x="${(x - barW / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="1.5" fill="${a.color}" opacity="${isSel ? BAR_FILTERED_SELECTED_OPACITY : BAR_FILTERED_DIMMED_OPACITY}"/>`);
      });
    } else {
      h.amounts.forEach(a => {
        const y = yFor(a.v);
        const barH = plotBottom - y;
        bars.push(`<rect x="${(x - barW / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="1.5" fill="var(--c-precip)" opacity="${BAR_LAYER_OPACITY}"/>`);
      });
    }
    if (h.amounts.length) {
      const vals = h.amounts.map(a => a.v);
      const min = Math.min(...vals), max = Math.max(...vals);
      const range = min === max ? `${min.toFixed(1)}mm` : `${min.toFixed(1)}–${max.toFixed(1)}mm`;
      const title = `${hourLabel}: ${range} · ${h.amounts.length} of ${h.total} models predict rain`;
      const hitY = yFor(max);
      bars.push(`<rect x="${(x - barW / 2).toFixed(1)}" y="${hitY.toFixed(1)}" width="${barW.toFixed(1)}" height="${(plotBottom - hitY).toFixed(1)}" fill="transparent"><title>${title}</title></rect>`);
    }

    if (h.avgProb !== null) {
      const opacity = 0.15 + (Math.max(0, Math.min(100, h.avgProb)) / 100) * 0.75;
      const dotY = plotBottom + dotOffset / 2;
      const title = `${hourLabel}: ${Math.round(h.avgProb)}% avg chance of rain (${h.reporting}/${h.total} models)`;
      dots.push(`<circle cx="${x.toFixed(1)}" cy="${dotY.toFixed(1)}" r="3" fill="var(--c-confidence)" opacity="${opacity.toFixed(2)}"><title>${title}</title></circle>`);
    }
  });

  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block;">
    ${axis.vLines}
    ${gridLines.join('')}
    ${bars.join('')}
    <line x1="${PAD_L}" y1="${plotBottom.toFixed(1)}" x2="${W - PAD_R}" y2="${plotBottom.toFixed(1)}" stroke="var(--grid-line)" stroke-width="1"/>
    ${dots.join('')}
    ${axis.dayLines}
    ${axis.hourLabels}
    ${axis.dayLabels}
  </svg>
  <div class="chart-caption">${selected
    ? 'Bars colored per model, dimmed for models outside your filter · dot = average chance of rain that hour, darker is higher'
    : 'Bar shade = how many models agree on that amount, darker is more · dot = average chance of rain that hour, darker is higher'}</div>`;
}

// load a remembered place if one was saved, otherwise default to Vienna, Austria
const remembered = loadRememberedPlace();
if (remembered) {
  rememberCheckbox.checked = true;
  loadPlace(remembered);
  searchInput.value = `${remembered.name}${remembered.country ? ', ' + remembered.country : ''}`;
} else {
  loadPlace({ name: 'Vienna', country: 'Austria', lat: 48.2082, lon: 16.3738 });
  searchInput.value = 'Vienna, Austria';
}
</script>
</body>
</html>
